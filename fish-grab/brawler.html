<meta charset="utf-8">
<title>Reef Brawler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed 3D ocean with a chase camera; HUD bars top-left, objective top-center, minimap + audio toggles top-right, touch pad bottom, modal cards */
:root{
  --abyss:#04121f; --foam:#e8fbff; --kelp:#7fe0a8; --gold:#ffd166; --danger:#ff3b5c; --muted:#9fc4d6; --energy:#4fd8ff; --boss:#c59bff; --safe:#5fe8d0;
  --f-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--abyss);color:var(--foam);font-family:var(--f-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;width:100%;overflow:hidden}
canvas#c{display:block;width:100%;height:100%}
#nums,#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.num{position:absolute;left:0;top:0;font:400 20px var(--f-display);color:#fff;text-shadow:0 2px 0 #04121f,0 0 6px #04121f;white-space:nowrap;will-change:transform,opacity}
.num.crit{color:var(--gold);font-size:28px}.num.hurt{color:var(--danger)}.num.coin{color:var(--gold);font-size:16px}.num.big{font-size:30px;color:var(--kelp)}.num.mat{font-size:14px}
.wl{position:absolute;left:0;top:0;font:400 15px var(--f-display);letter-spacing:.5px;white-space:nowrap;text-shadow:0 0 3px #04121f,0 2px 2px #04121f;will-change:transform}
.wl.sm{font-size:12px}.wl.big{font-size:19px}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 30px #ff1a3a;opacity:0;transition:opacity .15s}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;width:min(270px,46vw);pointer-events:none}
.bar{position:relative;height:16px;border-radius:8px;background:#04121fcc;border:1px solid #ffffff2a;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .12s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;padding-left:8px;font:600 11px var(--f-body);text-shadow:0 1px 2px #000;letter-spacing:.3px}
#hpBar i{background:linear-gradient(90deg,#ff3b5c,#ff7a59)}#hpBar.safe i{background:linear-gradient(90deg,#2fbfa5,var(--safe))}
#enBar{height:10px}#enBar i{background:var(--energy)}#enBar.full i{background:var(--gold)}
#xpBar{height:8px}#xpBar i{background:var(--kelp)}
.row{display:flex;gap:10px;font:600 12px var(--f-body);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;align-items:baseline;flex-wrap:wrap}
.row b{font-family:var(--f-display);font-weight:400;font-size:15px}
#bag.full{color:var(--danger)}
#safeTag{align-self:flex-start;font:400 13px var(--f-display);letter-spacing:1px;color:#04121f;background:var(--safe);padding:3px 10px;border-radius:999px}
#obj{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#04121fcc;border:1px solid #ffffff22;font:600 12px var(--f-body);white-space:nowrap;pointer-events:none;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
#obj svg{width:16px;height:16px;flex:none}
#mini{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:120px;height:120px;border-radius:14px;border:1px solid #ffffff2a;background:#04121fcc;pointer-events:none}
#audioCtl{position:absolute;top:calc(138px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:4px}
#audioCtl button{font:600 11px var(--f-body);color:var(--foam);background:#04121fcc;border:1px solid #ffffff2a;border-radius:999px;padding:4px 9px;cursor:pointer}
#audioCtl button[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
#bossBar{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(520px,70vw);pointer-events:none}
#bossBar .bar{height:14px}#bossBar .bar i{background:linear-gradient(90deg,#8a4aff,#ff3b5c)}
#bossName{font:400 16px var(--f-display);text-align:center;margin-bottom:4px;color:var(--boss);text-shadow:0 2px 0 #000;letter-spacing:1px}
#toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);font:400 clamp(22px,6vw,36px) var(--f-display);text-shadow:0 3px 0 #04121f,0 0 20px #000;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;width:90vw}
body.menu #toast{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;font-size:17px;background:#04121fe6;border:1px solid #ffffff22;border-radius:12px;padding:8px 14px;width:auto;max-width:min(90vw,520px);text-shadow:none}
#pad{position:absolute;inset:auto 0 0 0;height:46%;pointer-events:none}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff33;background:#ffffff0d;left:max(28px,env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px))}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#e8fbff55;border:2px solid #e8fbffaa}
.pb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid #ffffff55;background:#04121fb3;color:var(--foam);font:400 15px var(--f-display);display:grid;place-items:center;touch-action:none}
#bAtk{width:92px;height:92px;right:max(26px,env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));border-color:#ffd166;color:var(--gold);font-size:18px}
#bDash{width:64px;height:64px;right:calc(max(26px,env(safe-area-inset-right,0px)) + 104px);bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#bSpin{width:64px;height:64px;right:calc(max(26px,env(safe-area-inset-right,0px)) + 64px);bottom:calc(132px + env(safe-area-inset-bottom,0px));color:var(--energy);border-color:var(--energy)}
#bSpin.ready{background:#4fd8ff33;color:#fff}
#overlay{position:absolute;inset:0;display:flex;overflow-y:auto;background:radial-gradient(ellipse at 50% 40%,#0b2f4a99,#04121fee);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.card{margin:auto;max-width:500px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.credit{font:800 11px var(--f-body);letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
h1{font:400 clamp(44px,12vw,76px)/.92 var(--f-display);margin:0;text-shadow:0 4px 0 #0b2f4a,0 8px 24px #000a;text-wrap:balance}
h2{font:400 clamp(30px,8vw,44px)/1 var(--f-display);margin:0}
p{margin:0;color:var(--muted);line-height:1.5;font-size:15px;max-width:44ch}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:13px;color:var(--muted);background:#ffffff0a;border:1px solid #ffffff14;border-radius:12px;padding:12px 14px;width:100%}
.keys b{color:var(--foam);font-weight:600}
kbd{font:600 11px var(--f-body);border:1px solid #ffffff44;border-radius:4px;padding:1px 6px;color:var(--foam)}
button.go{font:400 22px var(--f-display);color:#04121f;background:var(--gold);border:0;border-radius:14px;padding:14px 36px;cursor:pointer;box-shadow:0 5px 0 #b8892a}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b8892a}
button:focus-visible{outline:3px solid var(--kelp);outline-offset:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:#ffffff0d;border:1px solid #ffffff14;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat b{font:400 22px var(--f-display);color:var(--foam);letter-spacing:0;text-transform:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.tab{font:400 15px var(--f-display);border:1px solid #ffffff22;background:#ffffff10;color:var(--foam);border-radius:10px;padding:9px 4px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--safe);color:#04121f;border-color:transparent}
.list{display:flex;flex-direction:column;gap:6px;width:100%}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:#ffffff0a;border:1px solid #ffffff12;text-align:left}
.item .t{font-weight:800;font-size:14px}.item .d{color:var(--muted);font-size:12px}
.pips{color:var(--gold);letter-spacing:2px;font-size:11px}
.need{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.need span{font-size:11px;padding:2px 7px;border-radius:999px;background:#ffffff12}
.need span.no{color:var(--danger);background:#ff3b5c1a}
.buy{font:400 15px var(--f-display);color:#04121f;background:var(--gold);border:0;border-radius:9px;padding:8px 12px;cursor:pointer;min-width:84px}
.buy[disabled]{background:#ffffff22;color:var(--muted);cursor:default}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;width:100%}
.mat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#ffffff0a;border:1px solid #ffffff12;font-size:13px;text-align:left}
.mat i{width:14px;height:14px;transform:rotate(45deg);border-radius:3px;flex:none}
.mat b{margin-left:auto;font:400 17px var(--f-display)}
.link{background:none;border:0;color:var(--muted);font:600 13px var(--f-body);text-decoration:underline;cursor:pointer}
@media (max-width:520px){#mini{width:92px;height:92px}#audioCtl{top:calc(110px + env(safe-area-inset-top,0px))}#obj{top:calc(146px + env(safe-area-inset-top,0px));max-width:80vw}}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="vign"></div>
  <div id="labels"></div>
  <div id="nums"></div>
  <div id="hud" hidden>
    <div class="bar" id="hpBar"><i></i><span id="hpTxt">100/100</span></div>
    <div class="bar" id="enBar"><i></i></div>
    <div class="row"><span>LV <b id="lv">1</b></span><span>Coins <b id="coins" style="color:var(--gold)">0</b></span><span id="bag">Bag <b id="bagN">0/40</b></span></div>
    <div class="bar" id="xpBar"><i></i></div>
    <span id="safeTag" hidden>SAFE ZONE</span>
  </div>
  <div id="obj" hidden><svg viewBox="0 0 24 24" id="arrow"><path d="M4 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="objTxt"></span></div>
  <canvas id="mini" hidden></canvas>
  <div id="audioCtl" hidden><button type="button" id="mMus" aria-pressed="true">Music</button><button type="button" id="mSfx" aria-pressed="true">SFX</button></div>
  <div id="bossBar" hidden><div id="bossName">BOSS</div><div class="bar"><i id="bossFill"></i></div></div>
  <div id="toast"></div>
  <div id="pad" hidden><div id="stick"><div id="knob"></div></div>
    <button class="pb" id="bDash" type="button">DASH</button><button class="pb" id="bSpin" type="button">SPIN</button><button class="pb" id="bAtk" type="button">ATTACK</button></div>
  <div id="overlay"><div class="card" id="card"><p>Loading…</p></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){$("card").innerHTML="<h2>3D didn't load</h2><p>Check your connection and reload.</p>";return}
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),irand=(a,b)=>Math.floor(rand(a,b+1));
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const angLerp=(a,b,k)=>a+angDiff(b,a)*Math.min(1,k);
const touch=matchMedia("(pointer:coarse)").matches;

/* ================= save ================= */
const SKEY="reefBrawlerSave";let SAVE={};try{SAVE=JSON.parse(localStorage.getItem(SKEY)||"{}")||{}}catch(e){}
const MATS={scale:{n:"Scale",c:"#ff9f68"},spine:{n:"Puffer Spine",c:"#e8c96a"},shell:{n:"Crab Shell",c:"#e2483d"},ink:{n:"Ink Sac",c:"#8a5ad8"},pearl:{n:"Pearl",c:"#f4f0ff"}};
const TROPHY={kingcrab:{n:"King's Claw",c:"#ff7a59"},bigeel:{n:"Abyssal Fang",c:"#c59bff"},mother:{n:"Mother's Crown",c:"#ffd166"}};
const ST=Object.assign({scale:0,spine:0,shell:0,ink:0,pearl:0},SAVE.stash||{});
const UP=Object.assign({spear:0,armor:0,fins:0},SAVE.up||{});
const BEATEN=Object.assign({},SAVE.bosses||{});
const EVER=new Set(SAVE.ever||[]);
const UPG={
 spear:{n:"Spear",d:"+15% damage per level",cost:l=>({shell:2+l*2,scale:4+l*3,pearl:l>=2?l-1:0,coins:60*(l+1)})},
 armor:{n:"Shell Armor",d:"+25 max HP per level",cost:l=>({scale:5+l*3,spine:2+l*2,pearl:l>=2?l-1:0,coins:60*(l+1)})},
 fins:{n:"Jet Fins",d:"Swim 6% faster, dash recharges 8% faster",cost:l=>({ink:2+l*2,spine:2+l,pearl:l>=2?l-1:0,coins:60*(l+1)})}};
const UPMAX=5,BAGMAX=40;

/* ================= renderer / scene ================= */
const cv=$("c"),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene(),WATER="#0f5f80";scene.background=new THREE.Color(WATER);scene.fog=new THREE.Fog(WATER,650,1500);
const cam=new THREE.PerspectiveCamera(50,1,10,6000);
scene.add(new THREE.HemisphereLight("#cfefff","#2a4a3a",.75));
const sun=new THREE.DirectionalLight("#fff3dd",.8);sun.position.set(-300,800,400);scene.add(sun);
let cw=1,ch=1;
function resize(){cw=cv.clientWidth;ch=cv.clientHeight;R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.setSize(cw,ch,false);cam.aspect=cw/ch;cam.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
const V3=(x,y,z)=>new THREE.Vector3(x,y,z),col=c=>new THREE.Color(c);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:.05},o));
const SPH=new THREE.SphereGeometry(1,16,12);
const mesh=(g,m)=>new THREE.Mesh(g,m);
const WB=2100;

/* ================= audio: sfx + procedural music ================= */
let AC=null,SFXG=null,MUSG=null;
const MUS={on:SAVE.music!==false,sfx:SAVE.sfx!==false,track:"explore",want:"explore",step:0,next:0,timer:0};
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
  SFXG=AC.createGain();SFXG.gain.value=MUS.sfx?1:0;SFXG.connect(comp);MUSG=AC.createGain();MUSG.gain.value=MUS.on?.55:0;MUSG.connect(comp);
  MUS.next=AC.currentTime+.1;MUS.timer=setInterval(sched,25)}catch(e){}}if(AC&&AC.state==="suspended")AC.resume()}
function tone(f,d,type="sine",v=.12,slide=0,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(SFXG);o.start(t);o.stop(t+d)}
let NB=null;function noiseBuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}return NB}
function noise(d,v=.15,f=1200,dest,t0){if(!AC)return;const t=t0||AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();fl.type="bandpass";fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.buffer=noiseBuf();s.connect(fl).connect(g).connect(dest||SFXG);s.start(t,Math.random()*.5);s.stop(t+d)}
const sfx={swing:()=>noise(.12,.12,2200),hit:()=>{tone(160,.12,"square",.12,.4);noise(.07,.18,600)},crit:()=>{tone(320,.1,"square",.1,.5);tone(900,.12,"triangle",.08,1.4)},
  hurt:()=>{tone(120,.25,"sawtooth",.15,.5);noise(.15,.15,400)},die:()=>{tone(300,.3,"triangle",.1,.3)},dash:()=>noise(.18,.1,900),
  spin:()=>{noise(.4,.16,1600);tone(200,.4,"sawtooth",.06,3)},lvl:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.25,"triangle",.1,0,i*.09)),
  chest:()=>[784,988,1319].forEach((f,i)=>tone(f,.18,"square",.06,0,i*.07)),warn:()=>tone(90,.5,"sawtooth",.07,.7),boom:()=>{noise(.35,.25,300);tone(70,.4,"sine",.2,.4)},
  shoot:()=>tone(500,.15,"sine",.06,.4),pick:()=>tone(1200+Math.random()*300,.07,"triangle",.05,1.3),store:()=>[523,784,1046,1319].forEach((f,i)=>tone(f,.14,"triangle",.07,0,i*.05)),
  craft:()=>{tone(1400,.3,"triangle",.1,.98);tone(2100,.2,"sine",.05,.97);noise(.08,.12,3000)},roar:()=>{tone(80,1.1,"sawtooth",.18,.5);tone(120,1,"square",.08,.6);noise(.9,.2,250)},
  safe:()=>[392,523,659].forEach((f,i)=>tone(f,.3,"sine",.06,0,i*.08)),win:()=>[523,659,784,1046,1319,1568].forEach((f,i)=>tone(f,.35,"triangle",.12,0,i*.11))};
// music
const mtof=m=>440*Math.pow(2,(m-69)/12);
const TRACKS={
 explore:{bpm:84, ch:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]},
 base:   {bpm:70, ch:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]]},
 combat: {bpm:128,ch:[[50,53,57],[46,50,53],[48,52,55],[45,49,52]]},
 boss:   {bpm:150,ch:[[52,55,59],[48,52,55],[50,54,57],[47,51,54]]}};
function mnote(m,t,d,type,v,att=.005){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mtof(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(MUSG);o.start(t);o.stop(t+d+.05)}
function kick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(MUSG);o.start(t);o.stop(t+.25)}
function sched(){if(!AC)return;if(MUS.next<AC.currentTime-.5)MUS.next=AC.currentTime+.05;while(MUS.next<AC.currentTime+.14){const st=MUS.step%16;if(st===0&&MUS.want!==MUS.track){MUS.track=MUS.want;MUS.step=0}
  playStep(MUS.step,MUS.next);const T=TRACKS[MUS.track];MUS.next+=60/T.bpm/4;MUS.step++}}
function playStep(s,t){if(!MUS.on)return;const T=TRACKS[MUS.track],bar=Math.floor(s/16)%4,st=s%16,c=T.ch[bar],beat=60/T.bpm,k=MUS.track;
  if(st===0)c.forEach(n=>mnote(n,t,beat*3.8,"triangle",k==="boss"?.02:.028,.25));
  if(k==="explore"){if(st===0||st===8)mnote(c[0]-12,t,beat*1.8,"sine",.09);if(st%4===0)mnote(c[(st/4)%3]+12,t,beat*1.2,"sine",.035);if((st===6||st===14)&&Math.random()<.5)mnote(c[2]+24,t,.25,"sine",.012)}
  if(k==="base"){if(st===0)mnote(c[0]-12,t,beat*3.5,"sine",.07,.1);if(st%4===0)mnote(c[[0,1,2,1][st/4]]+12,t,beat*1.6,"sine",.03,.02);if(st===10)mnote(c[2]+12,t,beat,"triangle",.02)}
  if(k==="combat"){if(st%2===0)mnote(c[0]-12,t,beat*.45,"sawtooth",.035);if(st%2===0)mnote(c[(st/2)%3]+12,t,beat*.35,"square",.014);
    if(st===0||st===8||st===10)kick(t,.32);if(st===4||st===12)noise(.14,.12,1800,MUSG,t);if(st%2===1)noise(.04,.035,7000,MUSG,t)}
  if(k==="boss"){mnote(c[0]-12+(st%4===3?12:0),t,beat*.22,"sawtooth",.035);if(st%2===0)mnote(c[st%3]+24,t,beat*.2,"square",.012);if(st===0||st===8)mnote(c[2]+12,t,beat*1.5,"sawtooth",.015,.02);
    if(st%4===0)kick(t,.36);if(st===4||st===12||st===14)noise(.14,.14,1800,MUSG,t);noise(.03,.03,8000,MUSG,t)}}

function decalRing(x,z,r,life,c="#ff3b5c"){const g=new THREE.Group();g.position.set(x,1.2,z);
  const fill=mesh(new THREE.CircleGeometry(r,40),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.12,depthWrite:false}));fill.rotation.x=-Math.PI/2;g.add(fill);
  const grow=mesh(new THREE.CircleGeometry(r,40),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.28,depthWrite:false}));grow.rotation.x=-Math.PI/2;grow.position.y=.2;g.add(grow);
  const edge=mesh(new THREE.RingGeometry(r-4,r,48),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.8,depthWrite:false}));edge.rotation.x=-Math.PI/2;edge.position.y=.3;g.add(edge);
  scene.add(g);const d={g,grow,life,t:0};DECALS.push(d);return d}
function decalLine(x,z,ang,len,w,life,c="#ff3b5c"){const g=new THREE.Group();g.position.set(x,1.2,z);g.rotation.y=-ang;
  const fill=mesh(new THREE.PlaneGeometry(len,w),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.14,depthWrite:false}));fill.rotation.x=-Math.PI/2;fill.position.x=len/2;g.add(fill);
  const grow=mesh(new THREE.PlaneGeometry(len,w),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.3,depthWrite:false}));grow.rotation.x=-Math.PI/2;grow.position.set(len/2,.2,0);g.add(grow);
  scene.add(g);const d={g,grow,life,t:0,line:len};DECALS.push(d);return d}
function stepDecals(dt){DECALS=DECALS.filter(d=>{d.t+=dt;const k=Math.min(1,d.t/d.life);
  if(d.line){d.grow.scale.x=k;d.grow.position.x=d.line*k/2}else d.grow.scale.setScalar(k);
  if(d.t>=d.life||d.dead){scene.remove(d.g);return false}return true})}

  const st=bagCount()?`STASH · walk in to store ${bagCount()}`:"STASH";if(lStash.el.textContent!==st)lStash.el.textContent=st}
const camPos=V3(SPAWN.x,700,SPAWN.z+500),camLook=V3(SPAWN.x,0,SPAWN.z);
function syncCam(dt){const port=cw<ch,bossZoom=G.boss?1.25:1,hgt=(port?820:560)*bossZoom,back=(port?440:420)*bossZoom;
  const tx=P.x+P.vx*.12,tz=P.z+P.vz*.12;camLook.x+=(tx-camLook.x)*Math.min(1,dt*6);camLook.z+=(tz-camLook.z)*Math.min(1,dt*6);
  camPos.set(camLook.x,hgt,camLook.z+back);if(G.shake>0){camPos.x+=rand(-1,1)*G.shake*18;camPos.y+=rand(-1,1)*G.shake*12}
  cam.position.lerp(camPos,Math.min(1,dt*8));cam.lookAt(camLook.x,0,camLook.z-20)}

/* ================= HUD ================= */
function updHud(){$("hpBar").querySelector("i").style.width=(P.hp/P.max*100)+"%";$("hpTxt").textContent=`${Math.ceil(P.hp)}/${P.max}${P.safe&&P.hp<P.max?" · healing":""}`;$("hpBar").classList.toggle("safe",P.safe);
  $("enBar").querySelector("i").style.width=P.en+"%";$("enBar").classList.toggle("full",P.en>=50);$("bSpin").classList.toggle("ready",P.en>=50);
  $("xpBar").querySelector("i").style.width=(P.xp/xpNeed()*100)+"%";$("lv").textContent=P.lvl;$("coins").textContent=P.coins;
  const bc=bagCount();$("bagN").textContent=`${bc}/${BAGMAX}`;$("bag").classList.toggle("full",bc>=BAGMAX);$("safeTag").hidden=!P.safe;
  if(G.boss)$("bossFill").style.width=Math.max(0,G.boss.hp/G.boss.max*100)+"%";
  let tgt=null,label="";const nb=BOSSES.find(b=>bossOpen(b)&&!BEATEN[b.k]);
  if(bc>=BAGMAX*.8){tgt=BASE;label=`Bag ${bc}/${BAGMAX}: store your loot at base`}
  else if(nb){tgt=nb;label=`Boss ready: ${nb.name}`}
  else{let bd=1e9;for(const c of CAMPS)if(!c.cleared&&c.state!=="cleared"){const d=Math.hypot(c.x-P.x,c.z-P.z);if(d<bd){bd=d;tgt=c}}
    const nx=BOSSES.find(b=>!bossOpen(b));label=tgt?`${tgt.name} · ${Math.round(bd/10)}m${nx?` · ${EVER.size}/${nx.need} camps for ${nx.name}`:""}`:"Explore. Camps return stronger."}
  const near=CHESTS.find(c=>Math.hypot(c.x-P.x,c.z-P.z)<900);if(near){tgt=near;label="Open the treasure chest"}
  $("objTxt").textContent=label;$("arrow").style.display=tgt?"":"none";if(tgt)$("arrow").style.transform=`rotate(${Math.atan2(tgt.z-P.z,tgt.x-P.x)*180/Math.PI}deg)`}
const miniC=$("mini"),mx=miniC.getContext("2d");
function drawMini(){const w=miniC.clientWidth,h=miniC.clientHeight,dpr=Math.min(2,devicePixelRatio||1);if(miniC.width!==w*dpr){miniC.width=w*dpr;miniC.height=h*dpr}
  mx.setTransform(dpr,0,0,dpr,0,0);mx.clearRect(0,0,w,h);const S=(w-12)/(WB*2),X=x=>6+(x+WB)*S,Y=z=>6+(z+WB)*S;
  mx.fillStyle="#1b6f8f";mx.beginPath();mx.roundRect(6,6,w-12,h-12,8);mx.fill();
  mx.fillStyle="#5fe8d0aa";mx.beginPath();mx.arc(X(BASE.x),Y(BASE.z),BASE.r*S,0,TAU);mx.fill();
  BOSSES.forEach(b=>{mx.strokeStyle=bossOpen(b)?b.col:b.col+"55";mx.lineWidth=2;mx.beginPath();mx.arc(X(b.x),Y(b.z),b.r*S,0,TAU);mx.stroke();if(BEATEN[b.k]){mx.fillStyle=b.col+"55";mx.fill()}});
  CAMPS.forEach(c=>{mx.fillStyle=c.cleared||c.state==="cleared"?"#7fe0a8":c.state==="active"?"#ff3b5c":"#ffb3be";mx.beginPath();mx.arc(X(c.x),Y(c.z),4,0,TAU);mx.fill()});
  CHESTS.forEach(c=>{mx.fillStyle="#ffd166";mx.fillRect(X(c.x)-3,Y(c.z)-3,6,6)});
  ENEMIES.forEach(e=>{if(e.hidden)return;const b=DEF[e.type].boss;mx.fillStyle=b?"#c59bff":"#ff3b5c";mx.fillRect(X(e.x)-1.5,Y(e.z)-1.5,b?5:3,b?5:3)});
  const px=X(P.x),py=Y(P.z),a=P.face;mx.fillStyle="#fff";mx.beginPath();mx.moveTo(px+Math.cos(a)*6,py+Math.sin(a)*6);mx.lineTo(px+Math.cos(a+2.4)*4,py+Math.sin(a+2.4)*4);mx.lineTo(px+Math.cos(a-2.4)*4,py+Math.sin(a-2.4)*4);mx.fill()}
let tT=0;function toast(t,c){const el=$("toast");el.textContent=t;el.style.color=c||"#fff";el.style.opacity=1;clearTimeout(tT);tT=setTimeout(()=>el.style.opacity=0,1900)}

/* ================= menus ================= */
function show(html,btns){$("card").innerHTML=html+btns.map((b,i)=>`<button class="${b.cls||"go"}" data-b="${i}" type="button">${b.label}</button>`).join("");$("overlay").hidden=false;document.body.classList.add("menu");$("overlay").scrollTop=0;
  btns.forEach((b,i)=>$("card").querySelector(`[data-b="${i}"]`).onclick=()=>{audio();b.fn()});const f=$("card").querySelector(".go");if(f)setTimeout(()=>f.focus({preventScroll:true}),50)}
function resume(){$("overlay").hidden=true;document.body.classList.remove("menu");if(G.mode==="menu")G.mode="play"}
const matChip=(k,n)=>`<div class="mat"><i style="background:${MATS[k].c}"></i>${MATS[k].n}<b>${n}</b></div>`;
function canAfford(c){return Object.entries(c).every(([k,v])=>!v||(k==="coins"?P.coins>=v:(ST[k]||0)>=v))}
function baseMenu(tab){G.mode="menu";let body="";
  if(tab==="bench"){body=`<p>Upgrades use materials from your <b>stash</b> (not your bag) plus coins.</p><div class="list">`+Object.entries(UPG).map(([k,u])=>{const l=UP[k],max=l>=UPMAX,c=max?{}:u.cost(l),ok=!max&&canAfford(c);
      const need=max?"":Object.entries(c).filter(([,v])=>v).map(([kk,v])=>`<span class="${(kk==="coins"?P.coins:(ST[kk]||0))>=v?"":"no"}">${v} ${kk==="coins"?"coins":MATS[kk].n}</span>`).join("");
      return `<div class="item"><span><span class="t">${u.n}</span> <span class="pips">${"●".repeat(l)}${"○".repeat(UPMAX-l)}</span><br><span class="d">${u.d}</span><div class="need">${need}</div></span>
      <button class="buy" data-up="${k}" type="button" ${ok?"":"disabled"}>${max?"Max":"Craft"}</button></div>`}).join("")+`</div>`}
  else if(tab==="stash"){const bc=bagCount();body=`<p>Your stash is safe forever. Your bag (${bc}/${BAGMAX}) is lost if you get knocked out, so bring it home.</p><div class="mats">${Object.keys(MATS).map(k=>matChip(k,ST[k]||0)).join("")}</div>`+
      (bc?`<p style="color:var(--gold)">Walk into the blue stash chest to store your ${bc} bag item${bc>1?"s":""}.</p>`:"")}
  else{body=`<div class="list">${BOSSES.map(b=>`<div class="item"><span><span class="t" style="color:${b.col}">${TROPHY[b.k].n}</span><br><span class="d">${BEATEN[b.k]?`Won from ${b.name}. On display in your base.`:bossOpen(b)?`Beat ${b.name} to earn it. The arena is open.`:`Clear ${b.need} different camps to open the ${b.name} arena (${EVER.size}/${b.need}).`}</span></span><span style="font:400 20px var(--f-display);color:${BEATEN[b.k]?b.col:"var(--muted)"}">${BEATEN[b.k]?"✓":"?"}</span></div>`).join("")}</div>`}
  show(`<div class="credit" style="color:var(--safe)">Home base</div><h2>${tab==="bench"?"Workbench":tab==="stash"?"Stash":"Trophies"}</h2>
   <div class="tabs">${[["bench","Workbench"],["stash","Stash"],["troph","Trophies"]].map(([k,l])=>`<button class="tab" data-tab="${k}" type="button" aria-pressed="${tab===k}">${l}</button>`).join("")}</div>${body}`,[{label:"Back to the reef",fn:resume}]);
  $("card").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>baseMenu(b.dataset.tab));
  $("card").querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const k=b.dataset.up,c=UPG[k].cost(UP[k]);if(!canAfford(c))return;for(const [kk,v] of Object.entries(c)){if(kk==="coins")P.coins-=v;else ST[kk]-=v}
    UP[k]++;if(k==="armor"){P.max=maxHP();P.hp=P.max}sfx.craft();toast(`${UPG[k].n} upgraded to level ${UP[k]}!`,"#ffb07a");persist();baseMenu("bench")})}
function title(){G.mode="title";const cont=(SAVE.lvl||1)>1||Object.keys(BEATEN).length||EVER.size;
  show(`<div class="credit">AZAM Production</div><h1>Reef Brawler</h1><p>Fight through enemy camps, haul loot home to your safe base, craft upgrades, and take down the three bosses of the reef.</p>
   <div class="keys">${touch?`<b>Move</b><span>Left thumb anywhere on the left side</span><b>Attack</b><span>ATTACK, keep tapping for a 3-hit combo</span><b>Dodge</b><span>DASH: nothing can hit you while dashing</span><b>Special</b><span>SPIN when the blue bar is half full</span>`
   :`<b>Move</b><span><kbd>WASD</kbd> or arrow keys</span><b>Aim</b><span>Mouse</span><b>Attack</b><span><kbd>Left click</kbd> or <kbd>J</kbd>, keep tapping for a 3-hit combo</span><b>Dodge</b><span><kbd>Space</kbd> or <kbd>K</kbd>: nothing can hit you while dashing</span><b>Special</b><span><kbd>Right click</kbd> or <kbd>L</kbd>: spin attack</span>`}
   <b>Base</b><span>Enemies can't enter or hurt you. Walk into the stash to store loot, into the workbench to upgrade.</span><b>Red marks</b><span>Where the next attack lands. Get out!</span></div>
   ${cont?`<p style="color:var(--kelp)">Welcome back: level ${P.lvl}, ${Object.keys(BEATEN).length}/3 bosses beaten.</p>`:""}`,[{label:cont?"Continue":"Dive in",fn:start},...(cont?[{label:"Start over",cls:"link",fn:wipeAsk}]:[])])}
function wipeAsk(){show(`<h2>Start over?</h2><p>This deletes your level, coins, stash, upgrades and trophies.</p>`,[{label:"Keep my save",fn:title},{label:"Yes, delete it",cls:"link",fn:()=>{try{localStorage.removeItem(SKEY)}catch(e){}location.reload()}}])}
function start(){G.mode="play";$("overlay").hidden=true;document.body.classList.remove("menu");["hud","obj","mini","audioCtl"].forEach(i=>$(i).hidden=false);$("pad").hidden=!touch;setAudio();toast("Find the red buoys: enemy camps","#ffd166")}
function die(){P.dead=true;G.mode="dead";sfx.die();const lost=bagCount();P.bag={};
  setTimeout(()=>show(`<div class="credit" style="color:var(--danger)">Knocked out</div><h2>You got wrecked</h2><p>${lost?`You dropped the ${lost} item${lost>1?"s":""} in your bag. `:""}Your stash, level, coins and upgrades are safe. You'll wake up at base.</p>`,[{label:"Respawn at base",fn:respawn}]),900)}
function respawn(){CAMPS.forEach(c=>{if(c.state==="active"){c.state="idle";ENEMIES.filter(e=>e.camp===c).forEach(removeEnemy)}});
  if(G.boss){removeEnemy(G.boss);G.boss=null;G.bossDef=null;$("bossBar").hidden=true}ENEMIES.filter(e=>!e.camp).forEach(removeEnemy);PROJ.forEach(p=>scene.remove(p.m));PROJ=[];
  Object.assign(P,{x:SPAWN.x,z:SPAWN.z,vx:0,vz:0,hp:P.max,dead:false,iframe:1.5,atk:-1,spin:0,dash:0});G.mode="play";$("overlay").hidden=true;document.body.classList.remove("menu");persist()}
function victory(){sfx.win();G.mode="menu";
  show(`<div class="credit">All bosses defeated</div><h2>Ruler of the Reef</h2><div class="stats"><div class="stat">Level<b>${P.lvl}</b></div><div class="stat">Enemies<b>${G.kills}</b></div><div class="stat">Coins<b>${P.coins}</b></div></div>
    <p>All three trophies are in your base. Bosses and camps come back for rematches, so keep crafting and keep fighting.</p>`,[{label:"Keep playing",fn:resume}])}

/* ================= input ================= */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),hit=new THREE.Vector3(),gp=new THREE.Plane(V3(0,1,0),0);
addEventListener("keydown",e=>{keys[e.code]=true;if(e.repeat)return;if(e.code==="Space"||e.code==="KeyK"||e.code==="ShiftLeft"){e.preventDefault();dash()}if(e.code==="KeyJ")attack();if(e.code==="KeyL")spin();if(e.code==="Escape"&&G.mode==="menu")resume()});
addEventListener("keyup",e=>keys[e.code]=false);
cv.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);
  if(ray.ray.intersectPlane(gp,hit)){mouse.x=hit.x;mouse.z=hit.z;mouse.active=true;mouse.t=G.time}});
cv.addEventListener("pointerdown",e=>{audio();if(e.pointerType==="mouse"){cv.dispatchEvent(new PointerEvent("pointermove",e));if(e.button===0)attack();if(e.button===2)spin()}});
cv.addEventListener("contextmenu",e=>e.preventDefault());
const stick=$("stick"),knob=$("knob");
function joyStart(e){if(e.target.closest(".pb")||e.target.closest("#audioCtl")||G.mode!=="play")return;if(joy.id!=null||e.clientX>cw*.55)return;audio();joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;
  stick.style.left=(e.clientX-60)+"px";stick.style.bottom="auto";stick.style.top=(e.clientY-60)+"px";joyMove(e)}
function joyMove(e){if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy),m=50;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
function joyEnd(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;knob.style.transform="";stick.style.top="";stick.style.left="";stick.style.bottom=""}
if(touch){$("wrap").addEventListener("pointerdown",joyStart);addEventListener("pointermove",joyMove);addEventListener("pointerup",joyEnd);addEventListener("pointercancel",joyEnd)}
const hold=(id,fn)=>$(id).addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();audio();fn()});
hold("bAtk",attack);hold("bDash",dash);hold("bSpin",spin);
addEventListener("visibilitychange",()=>{if(document.hidden)persist()});

/* ================= loop ================= */
let last=performance.now(),hudT=0;
function pickTrack(){if(G.boss)return"boss";if(P.safe)return"base";if(ENEMIES.some(e=>!e.hidden&&Math.hypot(e.x-P.x,e.z-P.z)<700))return"combat";return"explore"}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;const rdt=dt;
  if(G.mode==="play"){if(G.hs>0){G.hs-=dt;dt=0}
    if(dt>0){G.time+=dt;stepPlayer(dt);for(const e of [...ENEMIES])updEnemy(e,dt);separate();collide(P,16);ENEMIES.forEach(e=>{if(!e.hidden)collide(e,e.r*.8);keepOutOfBase(e)});stepProj(dt);stepPicks(dt)}}
  else G.time+=rdt*.3;
  MUS.want=G.mode==="title"?"explore":pickTrack();
  stepParts(rdt);stepDecals(dt);stepNums(rdt);G.shake=Math.max(0,G.shake-rdt*2.2);
  syncPlayer(rdt);ENEMIES.forEach(syncEnemy);syncWorld(rdt);syncCam(rdt);stepLabels();
  hudT-=rdt;if(hudT<=0&&G.mode!=="title"){hudT=.08;updHud();drawMini()}
  R.render(scene,cam);requestAnimationFrame(loop)}
title();requestAnimationFrame(loop);
})();
</script>
