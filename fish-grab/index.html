<title>Mother's Reef</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed canvas (island lobby or ocean dive), HUD strip on top, modal cards for shop / dock / results */
:root{
  --abyss:#04121f; --deep:#0b2f4a; --foam:#e8fbff; --kelp:#7fe0a8;
  --coral:#ff7a59; --gold:#ffd166; --danger:#ff3b5c; --muted:#9fc4d6;
  --f-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--abyss);color:var(--foam);font-family:var(--f-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0 0 auto;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;font-size:13px;font-weight:600;text-shadow:0 1px 2px #0008}
.chip{display:flex;gap:6px;align-items:baseline;background:#04121fb3;border:1px solid #ffffff1f;padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.chip b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.3px}
.lbl{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:1.2px}
#lives{color:var(--danger);letter-spacing:2px;font-size:15px}
#momBar{width:64px;height:6px;border-radius:3px;background:#ffffff22;overflow:hidden;align-self:center}
#momFill{display:block;height:100%;width:0;background:var(--kelp)}
#momTxt{font-family:var(--f-display);font-weight:400;font-size:14px}
.spacer{flex:1}
.pill{pointer-events:auto;background:#04121fb3;border:1px solid #ffffff1f;color:var(--foam);border-radius:999px;padding:5px 10px;font:600 12px var(--f-body);cursor:pointer}
#dash{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:76px;height:76px;border-radius:50%;border:2px solid #ffffff55;background:#0b2f4acc;color:var(--foam);
  font:400 16px var(--f-display);letter-spacing:.5px;display:none;touch-action:none}
#dash.ready{border-color:var(--gold);color:var(--gold)}
@media (pointer:coarse){#dash{display:block}}
#overlay{position:absolute;inset:0;display:grid;place-items:center;overflow-y:auto;background:radial-gradient(ellipse at 50% 40%,#0b2f4a99,#04121fee);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.card{max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.eyebrow{color:var(--kelp);text-transform:uppercase;letter-spacing:3px;font-size:12px;font-weight:800}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(42px,11vw,72px);line-height:.92;margin:0;text-wrap:balance;text-shadow:0 4px 0 #0b2f4a,0 8px 24px #000a}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);line-height:1.5;font-size:15px;max-width:40ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:#ffffff0d;border:1px solid #ffffff14;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px;width:100%;font-size:13px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 10px 9px 12px;border-radius:10px;background:#ffffff0a;border:1px solid #ffffff10;text-align:left;font-variant-numeric:tabular-nums}
.row .t{font-weight:800;color:var(--foam);font-size:14px}
.row .d{color:var(--muted);font-size:12px}
.row .pips{color:var(--gold);letter-spacing:2px;font-size:11px}
.row.locked{opacity:.45}
.buy{pointer-events:auto;font:400 15px var(--f-display);color:#04121f;background:var(--gold);border:0;border-radius:9px;padding:8px 12px;cursor:pointer;min-width:84px;font-variant-numeric:tabular-nums}
.buy[disabled]{background:#ffffff22;color:var(--muted);cursor:default}
.buy.green{background:var(--kelp)}
button.go{pointer-events:auto;font:400 22px var(--f-display);letter-spacing:.5px;color:#04121f;background:var(--gold);border:0;border-radius:14px;padding:14px 34px;cursor:pointer;box-shadow:0 5px 0 #b8892a}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b8892a}
button.link{background:none;border:0;color:var(--muted);font:600 13px var(--f-body);cursor:pointer;text-decoration:underline;pointer-events:auto}
button:focus-visible{outline:3px solid var(--kelp);outline-offset:3px}
.keys{font-size:12px;color:var(--muted)}
.keys kbd{font:600 11px var(--f-body);border:1px solid #ffffff33;border-radius:4px;padding:1px 5px;color:var(--foam)}
.bad{color:var(--danger)} .good{color:var(--kelp)} .goldt{color:var(--gold)}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font:400 clamp(20px,5.5vw,32px) var(--f-display);pointer-events:none;
  text-shadow:0 3px 0 #04121f,0 0 20px #000;opacity:0;transition:opacity .25s;text-align:center;width:min(90vw,640px)}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud" id="hudLobby" hidden>
    <div class="chip"><span class="lbl">Coins</span><b id="lCoins" class="goldt">0</b></div>
    <div class="chip"><span class="lbl">Income</span><b id="lRate">0/s</b></div>
    <div class="chip"><span class="lbl">Eggs</span><b id="lEggs">0/4</b></div>
    <div class="spacer"></div>
    <button class="pill mute" type="button">Sound on</button>
  </div>
  <div class="hud" id="hudDive" hidden>
    <div class="chip"><span class="lbl">Stage</span><b id="hStage">1</b></div>
    <div class="chip"><span class="lbl">Fish</span><b id="hFish">0/5</b></div>
    <div class="chip"><span class="lbl">Haul</span><b id="hHaul" class="goldt">0</b></div>
    <div class="chip" id="eggChip"><span class="lbl">Egg</span><b id="hEgg">at nest</b></div>
    <div class="chip"><span class="lbl">Mother</span><span id="momBar"><span id="momFill"></span></span><span id="momTxt">Calm</span></div>
    <div class="spacer"></div>
    <div class="chip"><span id="lives">♥</span></div>
    <button class="pill mute" type="button">Sound on</button>
  </div>
  <div id="toast"></div>
  <button id="dash" type="button">DASH</button>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>

<script>
(()=>{
/* ================= data ================= */
const STAGES=[
 {name:"Sunlit Shallows",depth:"5 m",   value:10, quota:5, babies:7, bSpd:55, flee:0,   calm:[11,13],warn:2.6,hunt:6, mSpd:125,turn:1.6,dark:0,  top:"#4fc6dc",bot:"#16709a"},
 {name:"Coral Reef",     depth:"15 m",  value:25, quota:6, babies:8, bSpd:70, flee:80,  calm:[9,11], warn:2.3,hunt:7, mSpd:145,turn:1.8,dark:0,  top:"#2fa9c9",bot:"#0d557c"},
 {name:"Kelp Forest",    depth:"30 m",  value:50, quota:8, babies:9, bSpd:85, flee:105, calm:[7,9],  warn:2.0,hunt:8, mSpd:165,turn:2.0,dark:.2, top:"#1f8aa6",bot:"#08405e"},
 {name:"Open Blue",      depth:"80 m",  value:100,quota:10,babies:10,bSpd:100,flee:125, calm:[5.5,7],warn:1.8,hunt:9, mSpd:185,turn:2.2,dark:.35,top:"#166d93",bot:"#052b45"},
 {name:"Twilight Zone",  depth:"300 m", value:250,quota:12,babies:11,bSpd:115,flee:140, calm:[4,5.5],warn:1.5,hunt:10,mSpd:200,turn:2.4,dark:.7, top:"#0d3d5f",bot:"#03172a"},
 {name:"The Abyss",      depth:"1,000 m",value:500,quota:14,babies:12,bSpd:130,flee:160,calm:[3,4],  warn:1.2,hunt:12,mSpd:215,turn:2.6,dark:.88,top:"#071f33",bot:"#010812"}
];
const EGGS=[
 {name:"Shallow Egg", rate:2,  col:"#f6e7c1",spot:"#d9a95b"},
 {name:"Reef Egg",    rate:6,  col:"#ff9f68",spot:"#ffe08a"},
 {name:"Kelp Egg",    rate:15, col:"#7fe0a8",spot:"#24774a"},
 {name:"Blue Egg",    rate:40, col:"#5fb8ff",spot:"#e8fbff"},
 {name:"Twilight Egg",rate:110,col:"#c59bff",spot:"#3a1d6e"},
 {name:"Abyss Egg",   rate:300,col:"#ff3b5c",spot:"#2a0008"}
];
const UPS={
 speed:{name:"Flippers",      desc:"Swim and run faster",          max:5,cost:l=>100*3**l},
 dash: {name:"Jet Tank",      desc:"Dash recharges faster",        max:5,cost:l=>150*3**l},
 shield:{name:"Shark Cage",   desc:"Survive one more bite per dive",max:3,cost:l=>600*5**l},
 slots:{name:"Base Expansion",desc:"One more egg pedestal",        max:6,cost:l=>Math.round(250*2.5**l)}
};
const BABY_COLORS=["#ff9f68","#ffd166","#7fe0a8","#ff7aa2","#8fd3ff","#c59bff"];
const RESTOCK=45000;

/* ================= save ================= */
const KEY="mothersReefSave2";
function fresh(){return{coins:0,vault:0,unlocked:0,cleared:[],up:{speed:0,dash:0,shield:0,slots:0},base:[],rival:[0,0,0],restock:[0,0,0],last:Date.now(),seen:false}}
let SV=fresh();
try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r)SV=Object.assign(fresh(),r,{up:Object.assign(fresh().up,r.up||{})})}catch(e){}
function persist(){SV.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(SV))}catch(e){}}
const slots=()=>4+SV.up.slots;
const rate=()=>SV.base.reduce((a,t)=>a+EGGS[t].rate,0);
let offline=0;{const el=Math.min(7200,Math.max(0,(Date.now()-SV.last)/1000));offline=Math.floor(rate()*el);SV.vault+=offline}
const fmt=n=>{n=Math.floor(n);return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+"M":n>=1e4?(n/1e3).toFixed(n>=1e5?0:1)+"k":n.toLocaleString()};

/* ================= canvas ================= */
const $=id=>document.getElementById(id);
const cv=$("c"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,SURF=56,LY=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);SURF=Math.max(56,H*0.09);layout();if(G&&G.mode==="dive")decor=makeDecor()}
addEventListener("resize",resize);

/* ================= audio ================= */
let AC=null,muted=false;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume()}
function tone(f,d,type="sine",v=.15,slide=0){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const sfx={grab:()=>tone(660,.12,"triangle",.12,1.6),gold:()=>{tone(880,.1,"triangle",.12,1.5);setTimeout(()=>tone(1320,.18,"triangle",.1,1.3),80)},
 warn:()=>tone(110,.6,"sawtooth",.08,.7),chomp:()=>{tone(180,.35,"square",.18,.3);tone(70,.6,"sawtooth",.15,.5)},dash:()=>tone(300,.15,"sine",.08,2),
 coin:()=>{tone(988,.08,"square",.06);setTimeout(()=>tone(1319,.14,"square",.06),70)},buy:()=>{[523,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.15,"triangle",.1),i*70))},
 egg:()=>{tone(400,.2,"triangle",.12,2)},snap:()=>{tone(220,.1,"square",.15,.5);setTimeout(()=>tone(160,.15,"square",.15,.5),90)},
 clear:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,"triangle",.12),i*110))};
document.querySelectorAll(".mute").forEach(b=>b.onclick=()=>{muted=!muted;document.querySelectorAll(".mute").forEach(x=>x.textContent=muted?"Sound off":"Sound on")});

/* ================= state ================= */
const rand=(a,b)=>a+Math.random()*(b-a);
const G={mode:"title",stage:0,lives:1,haul:0,count:0,gold:0,t:0,egg:"nest"};
let P={x:0,y:0,vx:0,vy:0,a:0,dash:0,cd:0,inv:0,kick:0,carry:null};
let babies=[],mom=null,parts=[],decor=null,nest=null,shake=0,flash=0;
let crab={x:0,y:0,tx:0,ty:0,state:"patrol",ph:0,wait:0};
const keys={};const pointer={x:0,y:0,active:false};
const S=()=>STAGES[G.stage];
const pSpeed=()=>205*(1+.09*SV.up.speed);
const dashCd=()=>1.5*(1-.12*SV.up.dash);

/* ================= lobby layout ================= */
function layout(){const land=W>=H*0.95;const top=SURF+10;
  if(land){const isl={x:W*.03,y:top,w:W*.94,h:H-top-H*.06};
    LY={land,isl,
      base:{x:isl.x+isl.w*.04,y:isl.y+isl.h*.1,w:isl.w*.3,h:isl.h*.72},
      rival:{x:isl.x+isl.w*.66,y:isl.y+isl.h*.1,w:isl.w*.3,h:isl.h*.72},
      shop:{x:W/2,y:isl.y+isl.h*.25,r:Math.min(46,W*.05)},
      dock:{x:W/2,y:isl.y+isl.h*.86,r:34},
      spawn:{x:W/2,y:isl.y+isl.h*.6}};
    LY.collect={x:LY.base.x+LY.base.w+26,y:LY.base.y+LY.base.h/2,r:24};
  }else{const isl={x:W*.03,y:top,w:W*.94,h:H-top-H*.03};
    LY={land,isl,
      base:{x:isl.x+isl.w*.05,y:isl.y+isl.h*.04,w:isl.w*.9,h:isl.h*.3},
      rival:{x:isl.x+isl.w*.05,y:isl.y+isl.h*.64,w:isl.w*.9,h:isl.h*.32},
      shop:{x:isl.x+isl.w*.2,y:isl.y+isl.h*.49,r:36},
      dock:{x:isl.x+isl.w*.8,y:isl.y+isl.h*.49,r:32},
      spawn:{x:W/2,y:isl.y+isl.h*.49}};
    LY.collect={x:W/2,y:LY.base.y+LY.base.h+24,r:22};}
  // base pedestals: 10 positions
  const b=LY.base,cols=LY.land?2:5,rows=LY.land?5:2;LY.peds=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)LY.peds.push({x:b.x+b.w*(c+.5)/cols,y:b.y+18+(b.h-18)*(r+.5)/rows});
  const rv=LY.rival;LY.rpeds=[0,1,2].map(i=>LY.land?{x:rv.x+rv.w*.5,y:rv.y+rv.h*(i+.5)/3+6}:{x:rv.x+rv.w*(i+.5)/3,y:rv.y+rv.h*.55});
}
const inRect=(p,r)=>p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h;
const near=(p,c,r)=>Math.hypot(p.x-c.x,p.y-c.y)<r;

function rivalTier(){const u=SV.unlocked;let t=Math.max(0,u-1+(Math.random()<.55?1:0));if(Math.random()<.1)t++;return Math.min(5,t)}
function restockRival(){const now=Date.now();for(let i=0;i<3;i++){if(SV.rival[i]==null&&now>=SV.restock[i])SV.rival[i]=rivalTier()}}

function addEgg(t,src){if(SV.base.length<slots()){SV.base.push(t);toast(`${EGGS[t].name} added to your base!`,EGGS[t].col)}
  else{let lo=0;SV.base.forEach((x,i)=>{if(x<SV.base[lo])lo=i});
    if(t>SV.base[lo]){const old=SV.base[lo];SV.base[lo]=t;toast(`${EGGS[t].name} replaced a ${EGGS[old].name}`,EGGS[t].col)}
    else{const v=EGGS[t].rate*60;SV.coins+=v;toast(`Base full. Sold ${EGGS[t].name} for ${fmt(v)}`,"#ffd166")}}
  SV.base.sort((a,b)=>b-a);sfx.egg();persist();updLobbyHud()}

function enterLobby(){G.mode="lobby";layout();P=Object.assign(P,{x:LY.spawn.x,y:LY.spawn.y,vx:0,vy:0,a:-Math.PI/2,dash:0,cd:0,inv:0,carry:null,pad:"spawn"});
  crab.x=LY.rival.x+LY.rival.w/2;crab.y=LY.rival.y+LY.rival.h/2;crab.state="patrol";crab.tx=crab.x;crab.ty=crab.y;parts=[];
  $("overlay").hidden=true;$("hudLobby").hidden=false;$("hudDive").hidden=true;updLobbyHud();persist()}

/* ================= overlays ================= */
function show(html,btns){G.prev=G.mode==="menu"?G.prev:G.mode;
  $("card").innerHTML=html+(btns||[]).map((b,i)=>`<button class="${b.cls||"go"}" data-b="${i}" type="button">${b.label}</button>`).join("");
  $("overlay").hidden=false;(btns||[]).forEach((b,i)=>{$("card").querySelector(`[data-b="${i}"]`).onclick=()=>{audio();b.fn()}});
  const f=$("card").querySelector(".go");if(f)setTimeout(()=>f.focus(),50)}
function closeMenu(){$("overlay").hidden=true;G.mode="lobby"}
function titleScreen(){G.mode="title";$("hudLobby").hidden=true;$("hudDive").hidden=true;
  show(`<div class="eyebrow">Egg heist on a fish island</div><h1>Mother's Reef</h1>
  <p>Steal eggs. Put them in your base. Every egg earns coins every second. Spend coins on gear, then dive deeper for rarer eggs.</p>
  <div class="list">
   <div class="row"><span><span class="t">Dive Dock</span><br><span class="d">Grab baby fish, steal Mother's egg from her nest, swim back to the boat.</span></span><span class="goldt">dive</span></div>
   <div class="row"><span><span class="t">Snapjaw's Nest</span><br><span class="d">A crab guards three eggs. Grab one and run it back to your base.</span></span><span class="bad">raid</span></div>
   <div class="row"><span><span class="t">Your Base</span><br><span class="d">Eggs pile coins into your vault. Step on the gold pad to collect.</span></span><span class="good">earn</span></div>
  </div>
  <div class="keys">Move: <kbd>mouse</kbd> / <kbd>WASD</kbd> / drag &nbsp; Dash: <kbd>Space</kbd> or <kbd>click</kbd></div>
  ${offline>0?`<p class="good">While you were away your eggs earned ${fmt(offline)} coins.</p>`:""}`,
  [{label:SV.seen?"Back to the island":"Start",fn:()=>{SV.seen=true;enterLobby()}}])}
function shopMenu(){G.mode="menu";
  const rows=Object.entries(UPS).map(([k,u])=>{const l=SV.up[k],maxed=l>=u.max,c=maxed?0:u.cost(l);
    return `<div class="row"><span><span class="t">${u.name}</span> <span class="pips">${"●".repeat(l)}${"○".repeat(u.max-l)}</span><br><span class="d">${u.desc}</span></span>
    <button class="buy" data-up="${k}" type="button" ${maxed||SV.coins<c?"disabled":""}>${maxed?"Max":fmt(c)}</button></div>`}).join("");
  show(`<div class="eyebrow">Shop</div><h2>Gear Shack</h2><p>You have <b class="goldt">${fmt(SV.coins)}</b> coins.</p><div class="list">${rows}</div>`,
   [{label:"Done",fn:closeMenu},{label:"Reset all progress",cls:"link",fn:resetAsk}]);
  $("card").querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const k=b.dataset.up,c=UPS[k].cost(SV.up[k]);if(SV.coins>=c&&SV.up[k]<UPS[k].max){SV.coins-=c;SV.up[k]++;sfx.buy();persist();updLobbyHud();shopMenu()}})}
function resetAsk(){show(`<div class="eyebrow bad">Reset</div><h2>Wipe your save?</h2><p>All coins, eggs and gear will be gone.</p>`,
  [{label:"Keep my save",fn:shopMenu},{label:"Yes, wipe it",cls:"link",fn:()=>{SV=fresh();SV.seen=true;restockRival();persist();enterLobby()}}])}
function dockMenu(){G.mode="menu";
  const rows=STAGES.map((s,i)=>{const open=i<=SV.unlocked;
    return `<div class="row ${open?"":"locked"}"><span><span class="t">${i+1}. ${s.name}</span> <span class="d">${s.depth}</span><br><span class="d">Grab ${s.quota} · ${s.value}/fish · nest holds a <span style="color:${EGGS[i].col}">${EGGS[i].name}</span> (${EGGS[i].rate}/s)</span></span>
    <button class="buy ${SV.cleared[i]?"green":""}" data-st="${i}" type="button" ${open?"":"disabled"}>${open?(SV.cleared[i]?"Again":"Dive"):"Locked"}</button></div>`}).join("");
  show(`<div class="eyebrow">Dive Dock</div><h2>Pick a dive</h2><p>Clear a stage to unlock the next one down.</p><div class="list">${rows}</div>`,[{label:"Stay on the island",cls:"link",fn:closeMenu}]);
  $("card").querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{audio();G.stage=+b.dataset.st;stageIntro()})}
function stageIntro(){G.mode="menu";const s=S();
  show(`<div class="eyebrow">Stage ${G.stage+1} of 6 · ${s.depth} down</div><h2>${s.name}</h2>
  <div class="stats"><div class="stat"><span class="lbl">Grab</span><b>${s.quota}</b></div><div class="stat"><span class="lbl">Per fish</span><b class="goldt">${s.value}</b></div><div class="stat"><span class="lbl">Bites you survive</span><b>${SV.up.shield}</b></div></div>
  <p>${["She's slow up here. Learn her rhythm.","The little ones start to dodge you.","Darker water. Watch the warning bar.","She's faster than you now. Use your dash.","You can barely see. Trust the eyes in the dark.","Last stage. She barely rests down here."][G.stage]}</p>
  <p>Her <b style="color:${EGGS[G.stage].col}">${EGGS[G.stage].name}</b> sits in a nest on the sea floor. Take it and she comes for you right away.</p>`,
  [{label:"Dive",fn:startStage},{label:"Back",cls:"link",fn:dockMenu}])}

/* ================= dive ================= */
function spawnBaby(edge){const s=S();const gold=Math.random()<.12;let x,y;
  if(edge){x=Math.random()<.5?-20:W+20;y=rand(SURF+60,H-60)}else{x=rand(40,W-40);y=rand(SURF+80,H-60)}
  return{x,y,a:rand(0,6.28),vx:0,vy:0,r:gold?11:9,gold,col:gold?"#ffd166":BABY_COLORS[(Math.random()*6)|0],ph:rand(0,6),spd:s.bSpd*rand(.85,1.15)*(gold?1.25:1)}}
function makeDecor(){const d=[];const n=Math.ceil(W/38);
  for(let i=0;i<n;i++)d.push({x:i*38+rand(-10,10),h:rand(.25,.7),k:G.stage===2?1:(Math.random()<.35?1:0),c:rand(0,6),w:rand(10,22),hue:BABY_COLORS[i%6]});return d}
function startStage(){const s=S();
  P=Object.assign(P,{x:W/2,y:SURF+90,vx:0,vy:0,a:Math.PI/2,dash:0,cd:0,inv:1.5,carry:null});
  babies=[];for(let i=0;i<s.babies;i++)babies.push(spawnBaby(false));
  mom={state:"away",t:rand(...s.calm),x:-300,y:H/2,vx:0,vy:0,a:0,edge:0,r:58+G.stage*7,ph:0,mouth:0,ex:0,ey:0,enraged:false};
  nest={x:rand(W*.15,W*.85),y:H-30};if(Math.abs(nest.x-W/2)<60)nest.x+=120;
  parts=[];decor=makeDecor();G.haul=0;G.count=0;G.gold=0;G.t=0;G.egg="nest";G.lives=1+SV.up.shield;
  G.mode="dive";$("overlay").hidden=true;$("hudDive").hidden=false;$("hudLobby").hidden=true;updHud();toast(s.name,"#e8fbff")}
function bubble(x,y,big){parts.push({x:x+rand(-6,6),y:y+rand(-6,6),vx:rand(-20,20),vy:rand(-60,-20),r:big?rand(2,5):rand(1,2.5),life:rand(.8,1.6),t:0,kind:"b"})}
function spark(x,y,c){for(let i=0;i<14;i++){const a=rand(0,6.28),v=rand(60,180);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rand(1.5,3),life:.6,t:0,kind:"s",c})}}

function movePlayer(dt,maxS,bx0,by0,bx1,by1){let ax=0,ay=0;
  if(keys.KeyA||keys.ArrowLeft)ax-=1;if(keys.KeyD||keys.ArrowRight)ax+=1;if(keys.KeyW||keys.ArrowUp)ay-=1;if(keys.KeyS||keys.ArrowDown)ay+=1;
  const m=P.dash>0?maxS*2.6:maxS,k=Math.min(1,8*dt);
  if(ax||ay){const l=Math.hypot(ax,ay);P.vx+=(ax/l*m-P.vx)*k;P.vy+=(ay/l*m-P.vy)*k}
  else if(pointer.active){const dx=pointer.x-P.x,dy=pointer.y-P.y,d=Math.hypot(dx,dy);const sp=Math.min(m,d*4);if(d>2){P.vx+=(dx/d*sp-P.vx)*k;P.vy+=(dy/d*sp-P.vy)*k}}
  else{P.vx*=1-Math.min(1,3*dt);P.vy*=1-Math.min(1,3*dt)}
  if(P.dash>0){const v=Math.hypot(P.vx,P.vy);if(v<m*.7){const a=v>5?Math.atan2(P.vy,P.vx):P.a;P.vx=Math.cos(a)*m;P.vy=Math.sin(a)*m}}
  P.x+=P.vx*dt;P.y+=P.vy*dt;P.x=Math.max(bx0,Math.min(bx1,P.x));P.y=Math.max(by0,Math.min(by1,P.y));
  const sp=Math.hypot(P.vx,P.vy);if(sp>20)P.a=Math.atan2(P.vy,P.vx);P.kick+=dt*(2+sp/30);
  P.dash=Math.max(0,P.dash-dt);P.cd=Math.max(0,P.cd-dt);P.inv=Math.max(0,P.inv-dt);return sp}

function updateDive(dt){const s=S();G.t+=dt;
  const sp=movePlayer(dt,pSpeed()*(G.egg==="carried"?.88:1),14,SURF+4,W-14,H-24);
  if(Math.random()<dt*(3+sp/60))bubble(P.x,P.y-6);
  for(const b of babies){b.ph+=dt*8;b.a+=rand(-2,2)*dt;let tx=Math.cos(b.a)*b.spd,ty=Math.sin(b.a)*b.spd;
    const dx=b.x-P.x,dy=b.y-P.y,d=Math.hypot(dx,dy)||1;
    if(s.flee&&d<s.flee){const f=(1-d/s.flee)*b.spd*1.6;tx+=dx/d*f;ty+=dy/d*f;b.a=Math.atan2(ty,tx)}
    if(b.x<30)tx+=80;if(b.x>W-30)tx-=80;if(b.y<SURF+50)ty+=80;if(b.y>H-50)ty-=80;
    b.vx+=(tx-b.vx)*Math.min(1,3*dt);b.vy+=(ty-b.vy)*Math.min(1,3*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(d<b.r+16){b.dead=1;G.count++;if(b.gold){G.gold++;G.haul+=s.value*3;sfx.gold();spark(b.x,b.y,"#ffd166")}else{G.haul+=s.value;sfx.grab();spark(b.x,b.y,b.col)}
      if(mom.state==="away")mom.t=Math.max(.3,mom.t-1);
      if(G.count===s.quota)toast("Quota met! Swim up to the boat","#7fe0a8");updHud()}}
  babies=babies.filter(b=>!b.dead);while(babies.length<s.babies)babies.push(spawnBaby(true));
  // egg steal
  if(G.egg==="nest"&&Math.hypot(P.x-nest.x,P.y-(nest.y-10))<30){G.egg="carried";sfx.egg();spark(nest.x,nest.y-10,EGGS[G.stage].col);toast("You took her egg! RUN","#ff3b5c");
    mom.enraged=true;if(mom.state==="away"||mom.state==="leave"){if(mom.state==="leave"){mom.state="hunt";mom.t=s.hunt}else{mom.state="away";mom.t=0}}else if(mom.state==="hunt")mom.t+=3;updHud()}
  // mother
  mom.ph+=dt*(mom.state==="hunt"?7:4);mom.t-=dt;
  const mSpd=s.mSpd*(mom.enraged&&G.egg==="carried"?1.08:1);
  if(mom.state==="away"&&mom.t<=0){mom.state="warn";mom.t=mom.enraged&&G.egg==="carried"?Math.min(1,s.warn):s.warn;mom.edge=(Math.random()*3)|0;
    mom.ex=mom.edge===0?0:mom.edge===1?W:rand(W*.2,W*.8);mom.ey=mom.edge===2?H:rand(SURF+80,H-80);sfx.warn();if(G.egg!=="carried")toast("She's coming!","#ff3b5c")}
  else if(mom.state==="warn"&&mom.t<=0){mom.state="hunt";mom.t=s.hunt+(G.egg==="carried"?4:0);
    mom.x=mom.edge===0?-mom.r*2:mom.edge===1?W+mom.r*2:mom.ex;mom.y=mom.edge===2?H+mom.r*2:mom.ey;
    const a=Math.atan2(P.y-mom.y,P.x-mom.x);mom.vx=Math.cos(a)*mSpd;mom.vy=Math.sin(a)*mSpd}
  else if(mom.state==="hunt"||mom.state==="leave"){let tx,ty,spd=mSpd;
    if(mom.state==="hunt"){tx=P.x+P.vx*.2;ty=P.y+P.vy*.2;if(Math.hypot(P.x-mom.x,P.y-mom.y)<200)spd*=1.25;
      if(mom.t<=0){mom.state="leave";toast("She's leaving...","#7fe0a8")}}
    else{tx=mom.x<W/2?-600:W+600;ty=mom.y+200;spd*=1.1;
      if(mom.x<-mom.r*3||mom.x>W+mom.r*3||mom.y>H+mom.r*3){mom.state="away";mom.t=rand(...s.calm)*(G.egg==="carried"?.5:1)}}
    const dx=tx-mom.x,dy=ty-mom.y,d=Math.hypot(dx,dy)||1;
    mom.vx+=(dx/d*spd-mom.vx)*Math.min(1,s.turn*dt);mom.vy+=(dy/d*spd-mom.vy)*Math.min(1,s.turn*dt);
    mom.x+=mom.vx*dt;mom.y+=mom.vy*dt;if(mom.y<SURF+mom.r*.5){mom.y=SURF+mom.r*.5;mom.vy=Math.abs(mom.vy)}
    mom.a=Math.atan2(mom.vy,mom.vx);
    const hx=mom.x+Math.cos(mom.a)*mom.r*.55,hy=mom.y+Math.sin(mom.a)*mom.r*.55,hd=Math.hypot(P.x-hx,P.y-hy);
    mom.mouth+=((mom.state==="hunt"&&hd<220?1:0)-mom.mouth)*Math.min(1,6*dt);
    if(mom.state==="hunt"&&P.inv<=0&&hd<mom.r*.55+12){bitten();return}}
  if(G.count>=s.quota&&P.y<SURF+22&&Math.abs(P.x-W/2)<90){clearStage();return}
  stepParts(dt);updMom()}
function stepParts(dt){for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==="s"){p.vx*=.92;p.vy*=.92}if(p.kind==="b"&&G.mode==="dive"&&p.y<SURF)p.t=p.life}
  parts=parts.filter(p=>p.t<p.life);shake=Math.max(0,shake-dt*2);flash=Math.max(0,flash-dt*2)}
function bitten(){G.lives--;sfx.chomp();shake=1;flash=1;spark(P.x,P.y,"#ff3b5c");
  if(G.egg==="carried"){G.egg="nest";toast("You dropped the egg!","#ff3b5c")}
  if(G.lives>0){P.inv=2.2;mom.state="leave";if(G.egg!=="carried")toast("The cage held! One bite used","#ffd166");updHud();return}
  G.mode="chomp";updHud();setTimeout(()=>{G.mode="menu";
    show(`<div class="eyebrow bad">Swallowed</div><h2>Mother got you</h2><p>You lost this dive's haul${G.egg==="nest"?" and the egg went back to her nest":""}. Your base and coins are safe.</p>`,
    [{label:"Back to the island",fn:enterLobby},{label:"Dive again",cls:"link",fn:stageIntro}])},900)}
function clearStage(){const s=S();G.mode="menu";sfx.clear();
  const base=(G.count-G.gold)*s.value,gold=G.gold*s.value*3,speed=Math.max(0,Math.round((60-G.t)*s.value/10));
  const total=base+gold+speed;SV.coins+=total;SV.cleared[G.stage]=true;
  const newUnlock=G.stage===SV.unlocked&&SV.unlocked<5;if(newUnlock)SV.unlocked++;
  const gotEgg=G.egg==="carried";persist();
  show(`<div class="eyebrow good">Surfaced · Stage ${G.stage+1} clear</div><h2>${G.stage===5?"You robbed the Abyss":s.name+" cleared"}</h2>
  <div class="stats"><div class="stat"><span class="lbl">Fish ${G.count-G.gold}</span><b>${fmt(base)}</b></div><div class="stat"><span class="lbl">Gold ${G.gold}</span><b class="goldt">${fmt(gold)}</b></div><div class="stat"><span class="lbl">Speed</span><b>${fmt(speed)}</b></div></div>
  <p>+${fmt(total)} coins.${gotEgg?` You also brought home a <b style="color:${EGGS[G.stage].col}">${EGGS[G.stage].name}</b> (${EGGS[G.stage].rate} coins/s).`:" You left her egg behind."}</p>
  ${newUnlock?`<p class="good">${STAGES[SV.unlocked].name} unlocked. Snapjaw's eggs just got better too.</p>`:""}`,
  [{label:"Back to the island",fn:()=>{enterLobby();if(gotEgg)addEgg(G.stage)}}])}

/* ================= lobby update ================= */
function updateLobby(dt){const I=LY.isl;
  const carrying=P.carry!=null;
  movePlayer(dt,pSpeed()*(carrying?.78:1),I.x+14,I.y+14,I.x+I.w-14,I.y+I.h-14);
  restockRival();
  // pads
  let pad=null;if(near(P,LY.shop,LY.shop.r+8))pad="shop";else if(near(P,LY.dock,LY.dock.r+8))pad="dock";else if(near(P,LY.collect,LY.collect.r+6))pad="collect";
  if(pad!==P.pad){P.pad=pad;
    if(pad==="shop"){if(carrying)toast("Bring the egg to your base first","#ffd166");else{P.vx=P.vy=0;pointer.active=false;shopMenu()}}
    if(pad==="dock"){if(carrying)toast("Bring the egg to your base first","#ffd166");else{P.vx=P.vy=0;pointer.active=false;dockMenu()}}}
  if(pad==="collect"&&SV.vault>=1){const v=Math.floor(SV.vault);SV.coins+=v;SV.vault-=v;sfx.coin();spark(LY.collect.x,LY.collect.y,"#ffd166");toast(`+${fmt(v)} coins`,"#ffd166");persist()}
  // pick up rival egg
  if(!carrying)LY.rpeds.forEach((p,i)=>{if(SV.rival[i]!=null&&near(P,p,24)){P.carry=SV.rival[i];SV.rival[i]=null;SV.restock[i]=Date.now()+RESTOCK;crab.state="chase";sfx.snap();toast(`Got a ${EGGS[P.carry].name}! Run to your base`,"#ff3b5c");persist()}});
  if(P.carry!=null&&inRect(P,LY.base)){const t=P.carry;P.carry=null;crab.state="home";addEgg(t)}
  // crab
  crab.ph+=dt*10;const rv=LY.rival;
  if(crab.state==="chase"&&P.carry!=null){const cs=135+P.carry*17;const dx=P.x-crab.x,dy=P.y-crab.y,d=Math.hypot(dx,dy)||1;crab.x+=dx/d*cs*dt;crab.y+=dy/d*cs*dt;
    if(d<26&&P.inv<=0){const i=SV.rival.findIndex(x=>x==null);if(i>=0){SV.rival[i]=P.carry;SV.restock[i]=0}P.carry=null;crab.state="home";
      sfx.chomp();shake=.7;flash=.7;toast("Snapped! The egg went back","#ff3b5c");P.x=LY.spawn.x;P.y=LY.spawn.y;P.vx=P.vy=0;P.inv=1;persist()}}
  else{if(crab.state==="chase")crab.state="home";
    if(crab.state==="home"){crab.tx=rv.x+rv.w/2;crab.ty=rv.y+rv.h/2;if(near(crab,{x:crab.tx,y:crab.ty},10))crab.state="patrol"}
    else if(near(crab,{x:crab.tx,y:crab.ty},8)){crab.wait-=dt;if(crab.wait<=0){crab.tx=rand(rv.x+20,rv.x+rv.w-20);crab.ty=rand(rv.y+30,rv.y+rv.h-20);crab.wait=rand(.3,1.2)}}
    const dx=crab.tx-crab.x,dy=crab.ty-crab.y,d=Math.hypot(dx,dy)||1,v=crab.state==="home"?120:60;if(d>2){crab.x+=dx/d*Math.min(d,v*dt);crab.y+=dy/d*Math.min(d,v*dt)}}
  stepParts(dt)}

/* ================= HUD ================= */
let hudT=0;
function updLobbyHud(){$("lCoins").textContent=fmt(SV.coins);$("lRate").textContent=fmt(rate())+"/s";$("lEggs").textContent=`${SV.base.length}/${slots()}`}
function updHud(){const s=S();$("hStage").textContent=`${G.stage+1} · ${s.name}`;$("hFish").textContent=`${G.count}/${s.quota}`;$("hFish").className=G.count>=s.quota?"good":"";
  $("hHaul").textContent=fmt(G.haul);$("hEgg").textContent=G.egg==="carried"?"CARRYING":"at nest";$("hEgg").style.color=G.egg==="carried"?EGGS[G.stage].col:"";
  $("lives").textContent="♥".repeat(Math.max(0,G.lives))+"♡".repeat(Math.max(0,1+SV.up.shield-G.lives))}
function updMom(){const s=S(),f=$("momFill"),t=$("momTxt");
  if(mom.state==="away"){const pct=1-mom.t/s.calm[1];f.style.width=Math.max(0,Math.min(1,pct))*100+"%";f.style.background=pct>.7?"#ffd166":"#7fe0a8";t.textContent="Calm";t.style.color="#7fe0a8"}
  else if(mom.state==="warn"){f.style.width="100%";f.style.background="#ff3b5c";t.textContent="Coming";t.style.color="#ffd166"}
  else if(mom.state==="hunt"){f.style.width=Math.max(0,mom.t/(s.hunt+4))*100+"%";f.style.background="#ff3b5c";t.textContent="HUNTING";t.style.color="#ff3b5c"}
  else{f.style.width="0%";t.textContent="Leaving";t.style.color="#9fc4d6"}}

/* ================= input ================= */
addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="Space"&&(G.mode==="dive"||G.mode==="lobby")){e.preventDefault();doDash()}});
addEventListener("keyup",e=>{keys[e.code]=false});
cv.addEventListener("pointermove",e=>{pointer.x=e.offsetX;pointer.y=e.offsetY;if(e.pointerType==="mouse")pointer.active=true});
cv.addEventListener("pointerdown",e=>{audio();pointer.x=e.offsetX;pointer.y=e.offsetY;pointer.active=true;if(e.pointerType==="mouse")doDash()});
cv.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")pointer.active=false});
cv.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")pointer.active=false});
$("dash").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();audio();doDash()});
function doDash(){if((G.mode!=="dive"&&G.mode!=="lobby")||P.cd>0)return;P.dash=.2;P.cd=dashCd();sfx.dash();for(let i=0;i<8;i++)bubble(P.x,P.y,1)}

/* ================= drawing ================= */
function fish(x,y,a,len,col,ph,o={}){ctx.save();ctx.translate(x,y);ctx.rotate(a);if(Math.cos(a)<0)ctx.scale(1,-1);
  const h=len*(o.h||.42),tw=Math.sin(ph)*len*.12;
  ctx.fillStyle=o.fin||col;ctx.beginPath();ctx.moveTo(-len*.38,0);ctx.lineTo(-len*.72,-h*.75+tw);ctx.lineTo(-len*.62,tw*.3);ctx.lineTo(-len*.72,h*.75+tw);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-len*.05,-h*.42);ctx.quadraticCurveTo(len*.05,-h*.95,len*.2,-h*.4);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,len*.48,h*.5,0,0,6.283);ctx.fill();
  if(o.belly){ctx.fillStyle=o.belly;ctx.beginPath();ctx.ellipse(len*.04,h*.18,len*.36,h*.24,0,0,6.283);ctx.fill()}
  if(o.stripes){ctx.strokeStyle=o.stripes;ctx.lineWidth=len*.03;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*len*.14,-h*.42);ctx.lineTo(i*len*.14-len*.03,h*.42);ctx.stroke()}}
  if(o.mouth>.02){const m=o.mouth;ctx.fillStyle="#2a0008";ctx.beginPath();ctx.moveTo(len*.5,0);ctx.lineTo(len*.22,-h*.32*m);ctx.lineTo(len*.22,h*.32*m);ctx.closePath();ctx.fill();
    ctx.fillStyle="#f5f0e6";for(let i=0;i<4;i++){const tx=len*(.25+i*.06),q=1-i*.2;ctx.beginPath();ctx.moveTo(tx,-h*.3*m*q);ctx.lineTo(tx+len*.025,-h*.12*m);ctx.lineTo(tx+len*.05,-h*.3*m*q);ctx.fill();
      ctx.beginPath();ctx.moveTo(tx,h*.3*m*q);ctx.lineTo(tx+len*.025,h*.12*m);ctx.lineTo(tx+len*.05,h*.3*m*q);ctx.fill()}}
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(len*.28,-h*.12,len*.065,0,6.283);ctx.fill();
  ctx.fillStyle=o.pupil||"#04121f";ctx.beginPath();ctx.arc(len*.3,-h*.12,len*.035,0,6.283);ctx.fill();
  if(o.brow){ctx.strokeStyle="#04121f";ctx.lineWidth=len*.025;ctx.beginPath();ctx.moveTo(len*.2,-h*.3);ctx.lineTo(len*.36,-h*.2);ctx.stroke()}
  ctx.restore()}
function egg(x,y,r,t,glow){const e=EGGS[t];ctx.save();ctx.translate(x,y);
  if(glow){ctx.shadowColor=e.col;ctx.shadowBlur=14+Math.sin(performance.now()/250)*5}
  ctx.fillStyle=e.col;ctx.beginPath();ctx.ellipse(0,0,r*.78,r,0,0,6.283);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle=e.spot;[[-.3,-.35,.18],[.25,-.05,.14],[-.1,.35,.16],[.35,.45,.1]].forEach(([a,b,c])=>{ctx.beginPath();ctx.arc(a*r,b*r,c*r,0,6.283);ctx.fill()});
  ctx.fillStyle="#ffffff66";ctx.beginPath();ctx.ellipse(-r*.3,-r*.45,r*.14,r*.24,-.5,0,6.283);ctx.fill();ctx.restore()}
function diver(){ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.a);const k=Math.sin(P.kick)*5;
  if(P.inv>0&&((P.inv*10)|0)%2)ctx.globalAlpha=.4;
  ctx.fillStyle="#1b2a3a";ctx.beginPath();ctx.moveTo(-14,-4);ctx.lineTo(-30,-8+k);ctx.lineTo(-30,-1+k);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-14,4);ctx.lineTo(-30,1-k);ctx.lineTo(-30,8-k);ctx.closePath();ctx.fill();
  ctx.fillStyle="#ff7a59";ctx.beginPath();ctx.roundRect(-16,-7,24,14,6);ctx.fill();
  ctx.fillStyle="#ffd166";ctx.fillRect(-12,-10,12,4);
  ctx.fillStyle="#e8fbff";ctx.beginPath();ctx.arc(11,0,8,0,6.283);ctx.fill();
  ctx.fillStyle="#4fc6dc";ctx.beginPath();ctx.ellipse(14,0,4,5.5,0,0,6.283);ctx.fill();
  if(P.dash>0){ctx.strokeStyle="#ffd16688";ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-34-i*8,(i-1)*7);ctx.lineTo(-48-i*10,(i-1)*7);ctx.stroke()}}
  ctx.restore();
  const carried=G.mode==="lobby"?P.carry:(G.egg==="carried"?G.stage:null);
  if(carried!=null)egg(P.x,P.y-24,10,carried,true)}
function label(t,x,y,c,sz=15){ctx.font=`${sz}px 'Lilita One',sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineWidth=4;ctx.lineJoin="round";ctx.strokeStyle="#04121fcc";ctx.strokeText(t,x,y);ctx.fillStyle=c;ctx.fillText(t,x,y)}
function drawParts(){for(const p of parts){const a=1-p.t/p.life;if(p.kind==="b"){ctx.strokeStyle=`rgba(232,251,255,${a*.7})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.stroke()}else{ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();ctx.globalAlpha=1}}}

function drawLobby(now){const I=LY.isl;
  // sea
  ctx.fillStyle="#1b7fa8";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#ffffff22";ctx.lineWidth=2;for(let y=10;y<H;y+=34){ctx.beginPath();for(let x=0;x<=W;x+=12)ctx.lineTo(x,y+Math.sin(x*.04+now*1.5+y)*3);ctx.stroke()}
  // island
  ctx.fillStyle="#d9bf86";ctx.beginPath();ctx.roundRect(I.x-8,I.y-8,I.w+16,I.h+16,40);ctx.fill();
  ctx.fillStyle="#ecd7a3";ctx.beginPath();ctx.roundRect(I.x,I.y,I.w,I.h,34);ctx.fill();
  // dock
  const d=LY.dock;ctx.fillStyle="#8a5a3b";
  if(LY.land){ctx.fillRect(d.x-22,d.y,44,H-d.y);for(let y=d.y;y<H;y+=12){ctx.fillStyle=y%24?"#7a4c30":"#8a5a3b";ctx.fillRect(d.x-22,y,44,10)}}
  else{ctx.fillRect(d.x,d.y-22,W-d.x,44);for(let x=d.x;x<W;x+=12){ctx.fillStyle="#7a4c30";ctx.fillRect(x,d.y-22,2,44)}}
  ctx.fillStyle="#4fc6dc";ctx.globalAlpha=.35+.15*Math.sin(now*3);ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.283);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle="#e8fbff";ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.lineDashOffset=-now*20;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.283);ctx.stroke();ctx.setLineDash([]);
  label("DIVE",d.x,d.y,"#e8fbff",18);
  // shop
  const s=LY.shop;ctx.fillStyle="#b9824f";ctx.beginPath();ctx.roundRect(s.x-s.r,s.y-s.r*.55,s.r*2,s.r*1.2,8);ctx.fill();
  ctx.fillStyle="#ff7a59";ctx.beginPath();ctx.moveTo(s.x-s.r-10,s.y-s.r*.5);ctx.lineTo(s.x,s.y-s.r*1.25);ctx.lineTo(s.x+s.r+10,s.y-s.r*.5);ctx.fill();
  ctx.fillStyle="#04121f";ctx.fillRect(s.x-9,s.y+s.r*.1,18,s.r*.55);label("SHOP",s.x,s.y-s.r*.1,"#ffd166",16);
  // base
  const b=LY.base;ctx.fillStyle="#7fe0a826";ctx.strokeStyle="#2e8a55";ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,16);ctx.fill();ctx.stroke();
  label("YOUR BASE",b.x+b.w/2,b.y+12,"#7fe0a8",16);
  LY.peds.forEach((p,i)=>{const open=i<slots();ctx.fillStyle=open?"#c9b48a":"#00000022";ctx.beginPath();ctx.ellipse(p.x,p.y+10,16,7,0,0,6.283);ctx.fill();
    if(!open){label("+",p.x,p.y+2,"#00000055",14);return}
    const t=SV.base[i];if(t!=null){egg(p.x,p.y-2+Math.sin(now*2+i)*1.5,12,t,true);label(`${EGGS[t].rate}/s`,p.x,p.y+22,"#ffd166",11)}});
  // collect pad
  const c=LY.collect;ctx.fillStyle="#ffd166";ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,6.283);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle="#b8892a";ctx.lineWidth=3;ctx.stroke();label(fmt(SV.vault),c.x,c.y,"#04121f",14);
  // rival
  const r=LY.rival;ctx.fillStyle="#ff3b5c1f";ctx.strokeStyle="#a32a3e";ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,16);ctx.fill();ctx.stroke();
  label("SNAPJAW'S NEST",r.x+r.w/2,r.y+12,"#ff7a8f",16);
  LY.rpeds.forEach((p,i)=>{ctx.fillStyle="#8a6a4a";ctx.beginPath();ctx.ellipse(p.x,p.y+10,18,8,0,0,6.283);ctx.fill();
    const t=SV.rival[i];if(t!=null){egg(p.x,p.y-2,12,t,true);label(EGGS[t].name,p.x,p.y+24,EGGS[t].col,11)}
    else label(Math.max(0,Math.ceil((SV.restock[i]-Date.now())/1000))+"s",p.x,p.y+2,"#ffffffaa",12)});
  // crab
  ctx.save();ctx.translate(crab.x,crab.y);const leg=Math.sin(crab.ph)*3;
  ctx.strokeStyle="#a32a3e";ctx.lineWidth=3;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-12,i*5);ctx.lineTo(-22,i*7+leg*(i?1:-1));ctx.stroke();ctx.beginPath();ctx.moveTo(12,i*5);ctx.lineTo(22,i*7-leg*(i?1:-1));ctx.stroke()}
  ctx.fillStyle="#e2483d";ctx.beginPath();ctx.ellipse(0,0,17,12,0,0,6.283);ctx.fill();
  const pinch=crab.state==="chase"?Math.abs(Math.sin(crab.ph*.8))*.6:.15;
  [-1,1].forEach(sd=>{ctx.beginPath();ctx.arc(sd*16,-14,7,sd>0?-pinch:Math.PI+pinch,sd>0?Math.PI*1.5+pinch:-Math.PI*.5-pinch,sd<0);ctx.lineTo(sd*16,-14);ctx.fill()});
  ctx.fillStyle="#fff";[-5,5].forEach(x=>{ctx.beginPath();ctx.arc(x,-10,3.5,0,6.283);ctx.fill()});ctx.fillStyle="#04121f";[-5,5].forEach(x=>{ctx.beginPath();ctx.arc(x,-10,1.6,0,6.283);ctx.fill()});
  ctx.restore();if(crab.state==="chase")label("!",crab.x,crab.y-34,"#ff3b5c",26);
  // palms
  [[I.x+24,I.y+I.h-24],[I.x+I.w-24,I.y+24]].forEach(([x,y])=>{ctx.fillStyle="#2e8a55";for(let i=0;i<5;i++){ctx.save();ctx.translate(x,y);ctx.rotate(i*1.26+Math.sin(now+i)*.05);ctx.beginPath();ctx.ellipse(14,0,16,5,0,0,6.283);ctx.fill();ctx.restore()}ctx.fillStyle="#7a4c30";ctx.beginPath();ctx.arc(x,y,5,0,6.283);ctx.fill()});
  drawParts();diver()}

function drawDive(now){const s=S();
  const g=ctx.createLinearGradient(0,SURF,0,H);g.addColorStop(0,s.top);g.addColorStop(1,s.bot);ctx.fillStyle=g;ctx.fillRect(-10,SURF,W+20,H);
  const sk=ctx.createLinearGradient(0,0,0,SURF);sk.addColorStop(0,G.stage>=4?"#1a1030":"#ffd7a8");sk.addColorStop(1,G.stage>=4?"#2b2050":"#a8e6f0");ctx.fillStyle=sk;ctx.fillRect(-10,0,W+20,SURF);
  if(s.dark<.5){ctx.globalAlpha=.07*(1-s.dark*2);ctx.fillStyle="#fff";for(let i=0;i<5;i++){const x=i*W/4+Math.sin(now*.3+i)*40;ctx.beginPath();ctx.moveTo(x-20,SURF);ctx.lineTo(x+20,SURF);ctx.lineTo(x+140,H);ctx.lineTo(x+60,H);ctx.fill()}ctx.globalAlpha=1}
  ctx.fillStyle=G.stage>=4?"#0a1420":"#c9b48a";ctx.beginPath();ctx.moveTo(-10,H);for(let x=-10;x<=W+10;x+=20)ctx.lineTo(x,H-14-Math.sin(x*.02)*6);ctx.lineTo(W+10,H);ctx.fill();
  for(const d of decor){if(d.k){ctx.strokeStyle=G.stage>=4?"#123a2c":"#2e8a55";ctx.lineWidth=d.w*.5;ctx.lineCap="round";ctx.beginPath();const top=H-(H-SURF)*d.h*(G.stage===2?1.25:.7);ctx.moveTo(d.x,H-10);
      for(let y=H-10;y>top;y-=14)ctx.lineTo(d.x+Math.sin(y*.03+now*1.2+d.c)*10,y);ctx.stroke()}
    else if(G.stage<=1){ctx.fillStyle=d.hue;ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(d.x,H-14,d.w*.8,Math.PI,0);ctx.fill();ctx.globalAlpha=1}}
  // nest
  ctx.strokeStyle="#6b4a2a";ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(nest.x,nest.y,30,10,0,0,Math.PI);ctx.stroke();
  for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(nest.x-28+i*9,nest.y+2);ctx.lineTo(nest.x-32+i*10,nest.y-8);ctx.stroke()}
  if(G.egg==="nest")egg(nest.x,nest.y-10,13,G.stage,true);
  // boat
  const bx=W/2,ready=G.count>=s.quota;
  ctx.fillStyle="#7a3b26";ctx.beginPath();ctx.moveTo(bx-70,SURF-12);ctx.lineTo(bx+70,SURF-12);ctx.lineTo(bx+50,SURF+8);ctx.lineTo(bx-50,SURF+8);ctx.fill();
  ctx.fillStyle="#e8fbff";ctx.fillRect(bx-18,SURF-34,30,22);ctx.fillStyle="#3a2a20";ctx.fillRect(bx-3,SURF-52,3,40);
  if(ready){ctx.strokeStyle="#7fe0a8";ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.lineDashOffset=-now*20;ctx.beginPath();ctx.ellipse(bx,SURF+10,95,22,0,0,6.283);ctx.stroke();ctx.setLineDash([])}
  ctx.strokeStyle="#ffffff66";ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=W;x+=10)ctx.lineTo(x,SURF+Math.sin(x*.05+now*2)*2);ctx.stroke();
  for(const b of babies)fish(b.x,b.y,Math.atan2(b.vy,b.vx),b.r*2.6,b.col,b.ph,{fin:b.gold?"#ffb703":undefined});
  if(G.mode!=="chomp")diver();
  if(mom.state==="hunt"||mom.state==="leave")fish(mom.x,mom.y,mom.a,mom.r*2.4,G.stage>=4?"#2b3a4f":"#3d5a73",mom.ph,{h:.5,belly:G.stage>=4?"#4a5a6e":"#9bb3c4",fin:"#26394d",stripes:"#2b425888",mouth:mom.mouth,brow:true,pupil:mom.state==="hunt"?"#ff3b5c":"#04121f"});
  drawParts();
  if(s.dark>0){const rg=ctx.createRadialGradient(P.x,P.y,70,P.x,P.y,Math.max(180,320-G.stage*25));rg.addColorStop(0,"rgba(1,6,14,0)");rg.addColorStop(1,`rgba(1,6,14,${s.dark})`);ctx.fillStyle=rg;ctx.fillRect(-10,SURF,W+20,H);
    for(const b of babies){ctx.fillStyle=b.gold?"#ffd16699":"#8fd3ff55";ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,6.283);ctx.fill()}
    if(G.egg==="nest"){ctx.fillStyle=EGGS[G.stage].col+"aa";ctx.beginPath();ctx.arc(nest.x,nest.y-10,4,0,6.283);ctx.fill()}
    if(mom.state==="hunt"||mom.state==="leave"){const fl=Math.cos(mom.a)<0?-1:1,L=mom.r*2.4,h=L*.5,ex=L*.28,ey=-h*.12*fl;
      ctx.shadowColor="#ff3b5c";ctx.shadowBlur=16;ctx.fillStyle="#ff3b5c";ctx.beginPath();ctx.arc(mom.x+Math.cos(mom.a)*ex-Math.sin(mom.a)*ey,mom.y+Math.sin(mom.a)*ex+Math.cos(mom.a)*ey,5,0,6.283);ctx.fill();ctx.shadowBlur=0}}
  if(mom.state==="warn"){const pulse=.4+.4*Math.sin(now*14);const gx=mom.edge===0?0:mom.edge===1?W:mom.ex,gy=mom.edge===2?H:mom.ey;
    const wg=ctx.createRadialGradient(gx,gy,0,gx,gy,260);wg.addColorStop(0,`rgba(255,59,92,${pulse})`);wg.addColorStop(1,"rgba(255,59,92,0)");ctx.fillStyle=wg;ctx.fillRect(-10,SURF,W+20,H);
    label("!",Math.max(30,Math.min(W-30,gx)),Math.max(SURF+40,Math.min(H-40,gy)),"#fff",40)}}

function draw(){const now=performance.now()/1000;ctx.save();if(shake>0)ctx.translate(rand(-8,8)*shake,rand(-8,8)*shake);
  const inDive=(G.mode==="dive"||G.mode==="chomp"||(G.mode==="menu"&&mom&&$("hudDive").hidden===false));
  if(inDive&&mom)drawDive(now);else drawLobby(now);
  ctx.restore();if(flash>0){ctx.fillStyle=`rgba(255,59,92,${flash*.45})`;ctx.fillRect(0,0,W,H)}}

let toastT=0;function toast(t,c){const el=$("toast");el.textContent=t;el.style.color=c;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,1600)}

/* ================= loop ================= */
let last=performance.now(),saveT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  SV.vault+=rate()*dt;
  if(G.mode==="lobby")updateLobby(dt);else if(G.mode==="dive")updateDive(dt);else if(G.mode==="chomp")stepParts(dt);
  hudT-=dt;if(hudT<=0){hudT=.25;updLobbyHud();$("dash").classList.toggle("ready",P.cd<=0)}
  saveT+=dt;if(saveT>5){saveT=0;persist()}
  draw();requestAnimationFrame(loop)}
addEventListener("visibilitychange",()=>{if(document.hidden)persist()});
resize();restockRival();P.x=LY.spawn.x;P.y=LY.spawn.y;titleScreen();requestAnimationFrame(loop);
})();
</script>
