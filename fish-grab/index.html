<meta charset="utf-8">
<title>Mother's Reef</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas (island lobby or side-on ocean dive), HUD strip on top, floating world labels, modal cards */
:root{
  --abyss:#04121f; --deep:#0b2f4a; --foam:#e8fbff; --kelp:#7fe0a8;
  --coral:#ff7a59; --gold:#ffd166; --danger:#ff3b5c; --muted:#9fc4d6; --whirl:#c59bff;
  --f-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--abyss);color:var(--foam);font-family:var(--f-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;width:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font:400 14px var(--f-display);letter-spacing:.4px;color:var(--foam);
  text-shadow:0 0 3px #04121f,0 0 3px #04121f,0 2px 2px #04121f;font-variant-numeric:tabular-nums;will-change:transform}
.lab.adminbtn{pointer-events:auto;cursor:pointer;font-size:14px;letter-spacing:1px;padding:5px 14px 5px 11px;border-radius:999px;background:#04121fd9;border:1.5px solid #ff3b5c;
  text-shadow:none;display:flex;gap:6px;align-items:center;box-shadow:0 4px 14px #0007}
.lab.adminbtn:hover{background:#2a0a14}
.lab.adminbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lab.big{font-size:18px}.lab.sm{font-size:11px}.lab.huge{font-size:44px;color:#fff}
#flash{position:absolute;inset:0;background:var(--danger);opacity:0;pointer-events:none}
.hud{position:absolute;inset:0 0 auto;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;font-size:13px;font-weight:600;text-shadow:0 1px 2px #0008}
.chip{display:flex;gap:6px;align-items:baseline;background:#04121fb3;border:1px solid #ffffff1f;padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.chip b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.3px}
.lbl{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:1.2px}
#lives{color:var(--danger);letter-spacing:2px;font-size:15px}
.bar{width:64px;height:6px;border-radius:3px;background:#ffffff22;overflow:hidden;align-self:center}
.bar i{display:block;height:100%;width:0;background:var(--kelp)}
#momTxt{font-family:var(--f-display);font-weight:400;font-size:14px}
.spacer{flex:1}
.pill{pointer-events:auto;background:#04121fb3;border:1px solid #ffffff1f;color:var(--foam);border-radius:999px;padding:5px 10px;font:600 12px var(--f-body);cursor:pointer}
#dash{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:76px;height:76px;border-radius:50%;border:2px solid #ffffff55;background:#0b2f4acc;color:var(--foam);
  font:400 16px var(--f-display);letter-spacing:.5px;display:none;touch-action:none}
#dash.ready{border-color:var(--gold);color:var(--gold)}
@media (pointer:coarse){#dash{display:block}}
#overlay{position:absolute;inset:0;display:flex;overflow-y:auto;background:radial-gradient(ellipse at 50% 40%,#0b2f4a88,#04121fe6);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.card{margin:auto;max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.eyebrow{color:var(--kelp);text-transform:uppercase;letter-spacing:3px;font-size:12px;font-weight:800}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(42px,11vw,72px);line-height:.92;margin:0;text-wrap:balance;text-shadow:0 4px 0 #0b2f4a,0 8px 24px #000a}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1;margin:0;text-wrap:balance}
h3{font:800 11px var(--f-body);text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:4px 0 -6px;align-self:flex-start}
p{margin:0;color:var(--muted);line-height:1.5;font-size:15px;max-width:42ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:#ffffff0d;border:1px solid #ffffff14;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px;width:100%;font-size:13px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 10px 9px 12px;border-radius:10px;background:#ffffff0a;border:1px solid #ffffff10;text-align:left;font-variant-numeric:tabular-nums}
.row .t{font-weight:800;color:var(--foam);font-size:14px}
.row .d{color:var(--muted);font-size:12px}
.row .pips{color:var(--gold);letter-spacing:2px;font-size:11px}
.row.dim{opacity:.5}
.tag{font:400 13px var(--f-display);letter-spacing:.4px}
.buy{pointer-events:auto;font:400 15px var(--f-display);color:#04121f;background:var(--gold);border:0;border-radius:9px;padding:8px 12px;cursor:pointer;min-width:84px;font-variant-numeric:tabular-nums}
.buy.ghost{background:#ffffff1a;color:var(--foam)}
.buy[disabled]{background:#ffffff22;color:var(--muted);cursor:default}
button.go{pointer-events:auto;font:400 22px var(--f-display);letter-spacing:.5px;color:#04121f;background:var(--gold);border:0;border-radius:14px;padding:14px 34px;cursor:pointer;box-shadow:0 5px 0 #b8892a}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b8892a}
button.link{background:none;border:0;color:var(--muted);font:600 13px var(--f-body);cursor:pointer;text-decoration:underline;pointer-events:auto}
button:focus-visible{outline:3px solid var(--kelp);outline-offset:3px}
.keys{font-size:12px;color:var(--muted)}
.keys kbd{font:600 11px var(--f-body);border:1px solid #ffffff33;border-radius:4px;padding:1px 5px;color:var(--foam)}
.bad{color:var(--danger)} .good{color:var(--kelp)} .goldt{color:var(--gold)} .whirl{color:var(--whirl)}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;
  background:#04121fd9;border:1px solid #ffffff22;border-radius:18px;box-shadow:0 6px 24px #0008;max-width:calc(100% - 32px)}
#bar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:56px;padding:6px 0 5px;border:0;border-radius:13px;background:transparent;color:var(--foam);font:600 10.5px var(--f-body);letter-spacing:.3px;cursor:pointer}
#bar button:hover{background:#ffffff14}
#bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bar .badge{position:absolute;top:2px;right:8px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;font:700 10px/15px var(--f-body);padding:0 3px}
@media (pointer:coarse){#bar{left:max(12px,env(safe-area-inset-left,0px));transform:none}#bar button{width:46px}body.inLobby #dash{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (max-width:420px){#bar button span.t{display:none}#bar button{width:42px;padding:9px 0}}
@media (max-width:480px){.hideNarrow{display:none!important}.hud{gap:6px}.chip{padding:4px 8px}}
#questPill{position:absolute;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;max-width:min(300px,55vw);padding:7px 11px;border-radius:12px;
  background:#04121fc4;border:1px solid #ffffff1f;color:var(--foam);font:600 12px var(--f-body);text-align:left;cursor:pointer}
#questPill .qb{height:4px;border-radius:2px;background:#ffffff22;overflow:hidden}#questPill .qb i{display:block;height:100%;background:var(--gold)}
#floorPick{position:absolute;left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:4px;padding:4px;border-radius:12px;background:#04121fc4;border:1px solid #ffffff1f}
#floorPick button{font:400 14px var(--f-display);border:0;border-radius:8px;padding:6px 10px;background:transparent;color:var(--muted);cursor:pointer}
#floorPick button[aria-pressed="true"]{background:var(--kelp);color:#04121f}
#uiToggle{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:2;width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;background:#04121fb3;border:1px solid #ffffff2a;color:var(--foam);cursor:pointer;padding:0}
#uiToggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hud{padding-right:max(62px,calc(env(safe-area-inset-right,0px) + 46px))!important}
body.uiHidden .hud,body.uiHidden #bar,body.uiHidden #questPill,body.uiHidden #mini,body.uiHidden #floorPick{display:none!important}
body.uiHidden #uiToggle{opacity:.55}
body.menuOpen #uiToggle{display:none}body.uiHidden #uiToggle:hover{opacity:1}
#mini{position:absolute;right:max(16px,env(safe-area-inset-right,0px));border-radius:12px;border:1px solid #ffffff22;background:#04121fb3;pointer-events:none}
.qrow .qb{height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden;margin-top:6px}.qrow .qb i{display:block;height:100%;background:var(--gold)}
.dex{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;width:100%;font-size:10px;align-items:center}
.dex .h{color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:800;font-size:9px;text-align:center}
.dex .rn{font-weight:800;font-size:11px;text-align:left;padding-right:4px}
.dex .cell{background:#ffffff0a;border:1px solid #ffffff10;border-radius:8px;aspect-ratio:1.3;display:grid;place-items:center;min-width:0}
.dex .cell.na{background:transparent;border-style:dashed;opacity:.35}
.dex svg{width:84%;height:auto}
.big-fish{width:150px;max-width:60%;height:auto}
.toggle{min-width:110px}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font:400 clamp(20px,5.5vw,32px) var(--f-display);pointer-events:none;
  text-shadow:0 3px 0 #04121f,0 0 20px #000;opacity:0;transition:opacity .25s;text-align:center;width:min(90vw,640px)}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="flash"></div>
  <div class="hud" id="hudLobby" hidden>
    <div class="chip"><span class="lbl">Coins</span><b id="lCoins" class="goldt">0</b></div>
    <div class="chip"><span class="lbl">Income</span><b id="lRate">0/s</b></div>

    <button class="pill mute" type="button">Sound on</button>
  </div>
  <div class="hud" id="hudDive" hidden>

    <div class="chip"><span class="lbl">Run loot</span><b id="hHaul" class="goldt">0</b></div>

    <div class="chip"><span id="lives">♥</span></div>
    <button class="pill mute" type="button">Sound on</button>

  <div id="toast"></div>
  <button id="dash" type="button">DASH</button>
  <button id="questPill" type="button" hidden></button>
  <canvas id="mini" hidden></canvas>
  <div id="floorPick" hidden></div>
  <button id="uiToggle" type="button" aria-label="Hide the UI" title="Hide UI (H)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>

    <button type="button" data-bar="forge"><svg viewBox="0 0 24 24"><path d="M4 9h11l-2 4H8z"/><path d="M15 9h5"/><path d="M10 13v4M7 20h7"/></svg><span class="t">Forge</span></button>
    <button type="button" data-bar="dive"><svg viewBox="0 0 24 24"><path d="M3 10c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/><path d="M3 16c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/></svg><span class="t">Dive</span></button>
    <button type="button" data-bar="book"><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg><span class="t">Fishdex</span><span class="badge" id="dexBadge" hidden></span></button>
    <button type="button" data-bar="quests"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span class="t">Quests</span><span class="badge" id="qBadge" hidden></span></button>
    <button type="button" data-bar="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span class="t">Settings</span></button>
  </nav>
  <div id="overlay"><div class="card" id="card"><p>Loading the reef…</p></div></div>
</div>
