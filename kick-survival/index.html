<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick Survival</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1b12; overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #fff; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex;
    align-items: center; justify-content: center; }
  canvas { background: #2e7d32; display: block; cursor: crosshair;
    box-shadow: 0 0 40px rgba(0,0,0,.6); }
  .overlay { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; flex-direction: column; background: rgba(0,0,0,.65); gap: 16px; }
  .overlay.show { display: flex; }
  h1 { margin: 0; font-size: 40px; }
  p { margin: 0; font-size: 18px; opacity: .85; }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .card { width: 190px; padding: 18px; border-radius: 12px; background: #1b3a24;
    border: 2px solid #4caf50; cursor: pointer; text-align: center; transition: transform .1s; }
  .card:hover { transform: translateY(-4px); background: #245232; }
  .card b { display: block; font-size: 20px; margin-bottom: 6px; }
  .card span { font-size: 14px; opacity: .8; }
  .card small { display: block; margin-top: 10px; opacity: .5; }
  button { font-size: 20px; padding: 12px 28px; border-radius: 10px; border: none;
    background: #4caf50; color: #fff; cursor: pointer; font-weight: bold; }
  button:hover { background: #66bb6a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="640"></canvas>

  <div id="upgrade" class="overlay">
    <h1 id="upTitle">Wave cleared!</h1>
    <p>Pick an upgrade (or press 1 / 2 / 3)</p>
    <div class="cards" id="cards"></div>
  </div>

  <div id="over" class="overlay">
    <h1>Game Over</h1>
    <p id="finalText"></p>
    <button id="again">Play again</button>
  </div>

  <div id="start" class="overlay show">
    <h1>⚽ Kick Survival</h1>
    <p>WASD / Arrows to move · Click to kick toward the cursor</p>
    <p>Survive the waves. Don't get touched.</p>
    <button id="go">Start</button>
  </div>
</div>

<script>
(() => {
  const W = 960, H = 640;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // ---------- Scale canvas to fit window ----------
  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    cv.style.width = (W * s) + 'px';
    cv.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  // ---------- Input ----------
  const keys = {};
  const mouse = { x: W / 2, y: H / 2, down: false };
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (state === 'upgrade' && ['1','2','3'].includes(e.key)) pickUpgrade(+e.key - 1);
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  function toCanvas(e) {
    const r = cv.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * W / r.width;
    mouse.y = (e.clientY - r.top) * H / r.height;
  }
  cv.addEventListener('mousemove', toCanvas);
  cv.addEventListener('mousedown', e => { toCanvas(e); mouse.down = true; });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });

  // ---------- Game state ----------
  let state = 'start'; // start | play | upgrade | over
  let player, balls, enemies, particles, score, wave, toSpawn, spawnTimer, waveBanner;

  const UPGRADES = [
    { id: 'kick',  name: 'Faster Kicks', desc: 'Kick cooldown −20%',
      ok: () => player.cooldown > 0.16, apply: () => player.cooldown = Math.max(0.15, player.cooldown * 0.8),
      lvl: () => `Now: ${player.cooldown.toFixed(2)}s` },
    { id: 'pierce', name: 'Power Shot', desc: 'Balls pierce +1 enemy',
      ok: () => true, apply: () => player.pierce++, lvl: () => `Now: pierces ${player.pierce}` },
    { id: 'multi', name: 'Multi-Ball', desc: 'Kick +1 ball in a spread',
      ok: () => player.multi < 7, apply: () => player.multi++, lvl: () => `Now: ${player.multi} ball(s)` },
    { id: 'boots', name: 'Speed Boots', desc: 'Move speed +15%',
      ok: () => true, apply: () => player.speed *= 1.15, lvl: () => `Now: ${Math.round(player.speed)}` },
    { id: 'life', name: 'Extra Life', desc: '+1 life',
      ok: () => true, apply: () => player.lives++, lvl: () => `Now: ${player.lives} lives` },
  ];

  function reset() {
    player = { x: W / 2, y: H / 2, r: 16, speed: 230, lives: 3, cooldown: 0.5, cd: 0,
               pierce: 0, multi: 1, invuln: 0, faceX: 1, faceY: 0 };
    balls = []; enemies = []; particles = [];
    score = 0; wave = 0;
    startWave();
  }

  function startWave() {
    wave++;
    const runners = 4 + wave * 3;
    const tanks = wave < 2 ? 0 : Math.floor(wave * 1.5);
    toSpawn = [];
    for (let i = 0; i < runners; i++) toSpawn.push('runner');
    for (let i = 0; i < tanks; i++) toSpawn.push('tank');
    shuffle(toSpawn);
    spawnTimer = 1.0;
    waveBanner = 2.0;
    state = 'play';
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  }

  function spawnEnemy(type) {
    const side = Math.floor(Math.random() * 4), m = 30;
    let x, y;
    if (side === 0) { x = Math.random() * W; y = -m; }
    else if (side === 1) { x = W + m; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = H + m; }
    else { x = -m; y = Math.random() * H; }
    const waveMul = 1 + (wave - 1) * 0.04;
    if (type === 'runner') enemies.push({ type, x, y, r: 11, hp: 1, maxHp: 1, speed: 135 * waveMul, flash: 0, kx: 0, ky: 0 });
    else enemies.push({ type, x, y, r: 20, hp: 3, maxHp: 3, speed: 55 * waveMul, flash: 0, kx: 0, ky: 0 });
  }

  function kick() {
    const dx = mouse.x - player.x, dy = mouse.y - player.y;
    const base = Math.atan2(dy, dx);
    const n = player.multi, spread = 0.18;
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * spread;
      balls.push({ x: player.x + Math.cos(a) * 20, y: player.y + Math.sin(a) * 20,
                   vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, r: 7,
                   pierceLeft: player.pierce, hit: new Set(), life: 1.6, spin: 0 });
    }
    player.cd = player.cooldown;
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.3, color });
    }
  }

  // ---------- Update ----------
  function update(dt) {
    if (waveBanner > 0) waveBanner -= dt;

    // Player movement
    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; }
    player.x = clamp(player.x + mx * player.speed * dt, player.r, W - player.r);
    player.y = clamp(player.y + my * player.speed * dt, player.r, H - player.r);
    player.cd -= dt;
    player.invuln -= dt;
    if (mouse.down && player.cd <= 0) kick();

    // Spawning
    if (toSpawn.length) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy(toSpawn.pop());
        spawnTimer = Math.max(0.25, 0.9 - wave * 0.05);
      }
    }

    // Balls
    for (const b of balls) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; b.spin += dt * 15;
      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) b.life = 0;
    }

    // Enemies
    for (const e of enemies) {
      const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
      e.x += (dx / d * e.speed + e.kx) * dt;
      e.y += (dy / d * e.speed + e.ky) * dt;
      e.kx *= Math.pow(0.02, dt); e.ky *= Math.pow(0.02, dt);
      e.flash -= dt;

      // Ball collisions
      for (const b of balls) {
        if (b.life <= 0 || b.hit.has(e) || e.hp <= 0) continue;
        if (Math.hypot(b.x - e.x, b.y - e.y) < b.r + e.r) {
          b.hit.add(e);
          e.hp--; e.flash = 0.1;
          const bl = Math.hypot(b.vx, b.vy) || 1;
          e.kx += b.vx / bl * 260; e.ky += b.vy / bl * 260;
          if (e.hp <= 0) {
            score += e.type === 'runner' ? 10 : 30;
            burst(e.x, e.y, e.type === 'runner' ? '#ff5252' : '#b388ff', 14);
          } else burst(b.x, b.y, '#fff', 5);
          if (b.pierceLeft > 0) b.pierceLeft--; else b.life = 0;
        }
      }

      // Contact with player
      if (e.hp > 0 && player.invuln <= 0 && d < e.r + player.r) {
        player.lives--;
        player.invuln = 1.5;
        burst(player.x, player.y, '#4fc3f7', 20);
        // push nearby enemies away
        for (const o of enemies) {
          const ox = o.x - player.x, oy = o.y - player.y, od = Math.hypot(ox, oy) || 1;
          if (od < 160) { o.kx += ox / od * 500; o.ky += oy / od * 500; }
        }
        if (player.lives <= 0) { gameOver(); return; }
      }
    }

    // Particles
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }

    balls = balls.filter(b => b.life > 0);
    enemies = enemies.filter(e => e.hp > 0);
    particles = particles.filter(p => p.life > 0);

    // Wave cleared
    if (!toSpawn.length && !enemies.length) {
      score += wave * 50;
      showUpgrades();
    }
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // ---------- Upgrade screen ----------
  let offered = [];
  function showUpgrades() {
    state = 'upgrade';
    balls = [];
    const pool = UPGRADES.filter(u => u.ok());
    shuffle(pool);
    offered = pool.slice(0, 3);
    document.getElementById('upTitle').textContent = `Wave ${wave} cleared!`;
    const cards = document.getElementById('cards');
    cards.innerHTML = '';
    offered.forEach((u, i) => {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<b>${u.name}</b><span>${u.desc}</span><small>${u.lvl()} · [${i + 1}]</small>`;
      d.onclick = () => pickUpgrade(i);
      cards.appendChild(d);
    });
    document.getElementById('upgrade').classList.add('show');
  }

  function pickUpgrade(i) {
    if (state !== 'upgrade' || !offered[i]) return;
    offered[i].apply();
    document.getElementById('upgrade').classList.remove('show');
    mouse.down = false;
    startWave();
  }

  function gameOver() {
    state = 'over';
    document.getElementById('finalText').textContent = `Score: ${score}  ·  Reached wave ${wave}`;
    document.getElementById('over').classList.add('show');
  }

  document.getElementById('again').onclick = () => {
    document.getElementById('over').classList.remove('show');
    reset();
  };
  document.getElementById('go').onclick = () => {
    document.getElementById('start').classList.remove('show');
    reset();
  };

  // ---------- Draw ----------
  function drawPitch() {
    ctx.fillStyle = '#2e7d32'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#338a37';
    for (let i = 0; i < W; i += 120) ctx.fillRect(i, 0, 60, H);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
    ctx.strokeRect(20, 20, W - 40, H - 40);
    ctx.beginPath(); ctx.moveTo(W / 2, 20); ctx.lineTo(W / 2, H - 20); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 80, 0, Math.PI * 2); ctx.stroke();
  }

  function draw() {
    drawPitch();
    if (state === 'start') return;

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Enemies
    for (const e of enemies) {
      if (e.type === 'runner') {
        ctx.fillStyle = e.flash > 0 ? '#fff' : '#e53935';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = e.flash > 0 ? '#fff' : '#7e57c2';
        ctx.fillRect(e.x - e.r, e.y - e.r, e.r * 2, e.r * 2);
        ctx.strokeStyle = '#311b92'; ctx.lineWidth = 3;
        ctx.strokeRect(e.x - e.r, e.y - e.r, e.r * 2, e.r * 2);
        // hp pips
        for (let i = 0; i < e.maxHp; i++) {
          ctx.fillStyle = i < e.hp ? '#fff' : 'rgba(255,255,255,.25)';
          ctx.fillRect(e.x - 12 + i * 9, e.y - e.r - 9, 6, 4);
        }
      }
    }

    // Balls
    for (const b of balls) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(b.x + Math.cos(b.spin) * 3, b.y + Math.sin(b.spin) * 3, 2.5, 0, Math.PI * 2); ctx.fill();
    }

    // Player
    const blink = player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0;
    if (!blink) {
      const a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      ctx.fillStyle = '#1e88e5';
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(player.x + Math.cos(a) * 10, player.y + Math.sin(a) * 10, 4, 0, Math.PI * 2); ctx.fill();
    }
    // Cooldown ring
    if (player.cd > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - player.cd / player.cooldown));
      ctx.stroke();
    }

    // Aim line
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();

    // HUD
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(12, 12, 210, 82);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 24, 36);
    ctx.fillText(`Wave: ${wave}`, 24, 60);
    ctx.fillText(`Lives: ${'♥'.repeat(Math.max(0, player.lives))}`, 24, 84);
    const left = toSpawn.length + enemies.length;
    ctx.textAlign = 'right'; ctx.font = '14px system-ui, sans-serif';
    ctx.fillText(`Enemies left: ${left}`, W - 16, 28);

    if (waveBanner > 0 && state === 'play') {
      ctx.globalAlpha = Math.min(1, waveBanner);
      ctx.textAlign = 'center'; ctx.font = 'bold 56px system-ui, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(`WAVE ${wave}`, W / 2, H / 2 - 120);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === 'play') update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
