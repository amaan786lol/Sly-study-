<title>Feral Circuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed canvas arena; HUD strip on top; base menu + modals are HTML overlays above the canvas */
:root{
  --ink:#070b14; --panel:#0f1828; --panel2:#16223a; --line:#24344f;
  --text:#e8f0ff; --muted:#8fa3c2; --wild:#9be15d; --tech:#37e2ff;
  --gold:#ffc93c; --pts:#c38bff; --danger:#ff4d6d;
  --f-display:"Bungee","Impact","Arial Black",system-ui,sans-serif;
  --f-body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;width:100%;overflow:hidden}
canvas{display:block}
button{font-family:var(--f-body);cursor:pointer}
button:focus-visible{outline:2px solid var(--tech);outline-offset:2px}

/* HUD */
.hud{position:absolute;inset:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;font-weight:600;font-size:13px}
.chip{display:flex;gap:6px;align-items:center;background:#070b14cc;border:1px solid var(--line);padding:5px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.chip b{font-family:var(--f-display);font-weight:400;font-size:14px}
.lbl{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:1.3px}
.coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #b8860b;display:inline-block}
.gem{width:11px;height:11px;transform:rotate(45deg);background:var(--pts);display:inline-block;box-shadow:inset -2px -2px 0 #7a46c9}
.hpbox{display:flex;align-items:center;gap:8px;background:#070b14cc;border:1px solid var(--line);padding:5px 10px;border-radius:6px}
.hpbar{width:120px;height:10px;background:#ffffff14;border-radius:2px;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4d6d,#ff8a5c);transition:width .12s}
#hpTxt{font-variant-numeric:tabular-nums;min-width:62px}
.spacer{flex:1}
.pill{pointer-events:auto;background:#070b14cc;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 12px;font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.pill:hover{border-color:var(--tech)}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(54px + env(safe-area-inset-top,0px));width:min(560px,calc(100% - 32px));pointer-events:none;display:flex;flex-direction:column;gap:4px}
.bossname{display:flex;gap:10px;align-items:baseline;justify-content:center;text-shadow:0 2px 3px #000}
.bossname b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:1px;color:#fff}
.bossname span{color:var(--muted);font-size:12px}
.bbar{height:9px;background:#00000099;border:1px solid #ffffff2a;border-radius:2px;overflow:hidden}
.bbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3355,#ffb347);transition:width .1s}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .25s,transform .25s;padding-inline:16px}
#banner.show{opacity:1;transform:scale(1)}
#banner h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,54px);letter-spacing:2px;color:#fff;text-shadow:0 0 18px var(--bcol,#37e2ff),0 4px 0 #000}
#banner p{margin:6px 0 0;color:var(--text);font-weight:600;text-shadow:0 2px 3px #000}
#touch{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end}
#touch button{border-radius:50%;border:2px solid #ffffff44;color:var(--text);font-family:var(--f-display);font-weight:400;touch-action:none}
#tDash{width:84px;height:84px;background:#37e2ff33;font-size:15px}
#tHeal{width:60px;height:60px;background:#ff4d6d33;font-size:11px}
#toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:6px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}

/* Base menu */
.screen{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y;
  background:linear-gradient(180deg,#070b14e6,#070b14f2);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.inner{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,46px);line-height:1;margin:0;letter-spacing:1px}
.logo .a{color:var(--wild)}.logo .b{color:var(--tech)}
.tag{color:var(--muted);font-size:13px;margin:4px 0 0}
.wallet{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.wallet .chip{font-size:14px}.wallet .chip b{font-size:16px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;color:var(--muted);padding:10px 14px;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-color:var(--tech)}
.tab:hover{color:var(--text)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:1px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.card.locked{opacity:.5}
.card.wild{border-top:3px solid var(--wild)}.card.tech{border-top:3px solid var(--tech)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.kicker{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700}
.kicker .t-wild{color:var(--wild)}.kicker .t-tech{color:var(--tech)}
.card h4{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.boss{font-size:13px}.boss b{font-family:var(--f-display);font-weight:400;color:var(--text);letter-spacing:.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.btn{background:var(--tech);color:#04121c;border:0;border-radius:6px;padding:9px 14px;font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
.btn:hover{filter:brightness(1.1)}
.btn.g{background:var(--gold)}.btn.p{background:var(--pts)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.done{color:var(--wild);font-weight:700;font-size:12px;letter-spacing:1px}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:14px;height:6px;border-radius:1px;background:#ffffff18}
.pips i.on{background:var(--pts)}
.price{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums}
canvas.prev{width:72px;height:72px;align-self:center}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;color:var(--muted);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.help b{color:var(--text)}
#modal{display:flex;align-items:center;justify-content:center;background:#070b14c4}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.mcard h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;letter-spacing:1px}
.mcard p{margin:0;color:var(--muted)}
.rewards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.mcard .row{justify-content:center}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
</style>

<div id="wrap">
  <canvas id="c"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hpbox"><div class="hpbar"><i id="hpFill"></i></div><span id="hpTxt">100/100</span></div>
    <div class="chip"><span class="lbl">Stage</span><b id="stTxt">1-1</b></div>
    <div class="chip"><span class="coin"></span><b id="coinTxt">0</b></div>
    <div class="spacer"></div>
    <button class="pill" id="healBtn">Heal (Q) ×<span id="potTxt">0</span></button>
    <button class="pill" id="pauseBtn">Pause</button>
  </div>
  <div id="bossbar" hidden>
    <div class="bossname"><b id="bossName"></b><span id="bossTitle"></span></div>
    <div class="bbar"><i id="bossFill"></i></div>
  </div>
  <div id="banner"><h2 id="bnT"></h2><p id="bnS"></p></div>
  <div id="touch" hidden><button id="tHeal">HEAL</button><button id="tDash">DASH</button></div>

  <div class="screen" id="hub">
    <div class="inner">
      <div class="top">
        <div>
          <h1 class="logo"><span class="a">FERAL</span> <span class="b">CIRCUIT</span></h1>
          <p class="tag">Hunt beasts in the wild. Break into high-tech labs. Take down the bosses.</p>
        </div>
        <div class="wallet">
          <div class="chip"><span class="coin"></span><b id="wCoins">0</b><span class="lbl">coins</span></div>
          <div class="chip"><span class="gem"></span><b id="wPts">0</b><span class="lbl">upgrade pts</span></div>
          <button class="pill" id="muteBtn">Sound: on</button>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab" data-tab="missions">Missions</button>
        <button class="tab" data-tab="upgrades">Upgrades</button>
        <button class="tab" data-tab="shop">Shop</button>
      </nav>
      <div id="hubBody" class="sec"></div>
    </div>
  </div>

  <div class="screen" id="modal" hidden><div class="mcard" id="mcard"></div></div>
  <div id="toast"></div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=$('c'), ctx=cv.getContext('2d'), wrap=$('wrap');
let W=1000,H=640,S=1,DPR=1;
const A={l:20,r:980,t:80,b:620};
function resize(){
  const sw=wrap.clientWidth||innerWidth, sh=wrap.clientHeight||innerHeight;
  DPR=Math.min(2,window.devicePixelRatio||1);
  S=Math.min(sw,sh)/620; W=sw/S; H=sh/S;
  cv.width=Math.round(sw*DPR); cv.height=Math.round(sh*DPR);
  cv.style.width=sw+'px'; cv.style.height=sh+'px';
  A.l=20; A.r=W-20; A.t=20+62/S; A.b=H-20;
}
addEventListener('resize',resize); resize();

/* ---------- data ---------- */
const STAGES=[
  {name:'Whispering Woods',theme:'wild',biome:'forest',rooms:[{wolf:4},{wolf:3,boar:2}],boss:'grizzlor'},
  {name:'Lab Sector A',theme:'tech',biome:'lab',rooms:[{drone:3,turret:1},{robodog:4,turret:2,lasers:1}],boss:'sentinel'},
  {name:'Spider Caves',theme:'wild',biome:'cave',rooms:[{spider:3,wolf:2},{spider:4,boar:2}],boss:'venom'},
  {name:'Reactor Core',theme:'tech',biome:'lab',rooms:[{drone:4,turret:2,lasers:1},{robodog:5,drone:3,lasers:2}],boss:'hydra'},
  {name:'Storm Peaks',theme:'wild',biome:'peak',rooms:[{hawk:4,wolf:3},{hawk:4,boar:3}],boss:'roc'},
  {name:'Omega Vault',theme:'tech',biome:'vault',rooms:[{drone:4,robodog:4,turret:2,lasers:2},{hawk:3,drone:4,turret:3,lasers:2}],boss:'omega'},
];
const BOSS={
  grizzlor:{name:'GRIZZLOR',title:'Ironclaw Bear',hp:650,r:46,col:'#7a4a2a'},
  sentinel:{name:'SENTINEL-9',title:'Lab Security AI',hp:900,r:44,col:'#8a98b0'},
  venom:{name:'VENOM QUEEN',title:'Brood Mother',hp:1150,r:46,col:'#5b2a78'},
  hydra:{name:'MECH HYDRA',title:'Three-headed war machine',hp:1500,r:50,col:'#4f5b6e'},
  roc:{name:'THUNDER ROC',title:'Storm Bird',hp:1800,r:44,col:'#c8a46a'},
  omega:{name:'OMEGA',title:'Vault Core',hp:2400,r:54,col:'#1b2440'},
};
const EN={
  wolf:{hp:30,r:14,spd:150,coin:3,col:'#9aa5b5',dmg:12},
  boar:{hp:65,r:18,spd:70,coin:5,col:'#8a5a3c',dmg:16},
  spider:{hp:36,r:14,spd:75,coin:4,col:'#2e2438',dmg:10},
  spiderling:{hp:12,r:9,spd:150,coin:1,col:'#4a2f5c',dmg:8},
  hawk:{hp:30,r:14,spd:190,coin:4,col:'#c99a5b',dmg:12},
  drone:{hp:34,r:13,spd:95,coin:4,col:'#7fdfff',dmg:10},
  turret:{hp:75,r:18,spd:0,coin:6,col:'#6c7a91',dmg:10},
  robodog:{hp:50,r:15,spd:135,coin:5,col:'#b8c4d6',dmg:14},
};
const UPG=[
  {id:'hp',name:'Vitality',desc:'+20 max HP',max:10},
  {id:'dmg',name:'Power',desc:'+15% damage',max:10},
  {id:'rate',name:'Rapid Fire',desc:'+9% fire rate',max:10},
  {id:'spd',name:'Agility',desc:'+6% move speed',max:8},
  {id:'dash',name:'Phase Dash',desc:'-12% dash cooldown',max:6},
  {id:'regen',name:'Nano Regen',desc:'+0.8 HP every second',max:5},
  {id:'multi',name:'Multishot',desc:'+1 extra projectile',max:3},
];
const upCost=(id,l)=>id==='multi'?3+l*2:1+Math.floor(l/3);
const WEAP={
  blaster:{name:'Pulse Blaster',price:0,desc:'Fast, reliable shots.',delay:.2,dmg:12,spd:720,r:5,n:1,spread:0,col:'#7ff6ff'},
  scatter:{name:'Scatter Cannon',price:250,desc:'5 pellets. Brutal up close.',delay:.42,dmg:7,spd:640,r:4.5,n:5,spread:.55,life:.55,col:'#ffd36b'},
  rail:{name:'Rail Lance',price:500,desc:'Slow, heavy beam that pierces every enemy.',delay:.62,dmg:38,spd:1500,r:4,n:1,spread:0,pierce:true,col:'#d6b8ff'},
  plasma:{name:'Seeker Plasma',price:800,desc:'Glowing orbs that chase targets.',delay:.3,dmg:14,spd:430,r:8,n:1,spread:0,homing:true,col:'#8dff9a'},
};
const SKINS={
  cadet:{name:'Cadet',price:0,c:'#3ad6ff',d:'#0e3b55',f:null},
  ember:{name:'Ember',price:150,c:'#ff6a3d',d:'#5a1a08',f:'horns',trail:'#ffb03d'},
  jungle:{name:'Jungle Scout',price:200,c:'#5fe36b',d:'#14431b',f:'leaf'},
  kitty:{name:'Neon Kitty',price:300,c:'#ff9bd2',d:'#5c1840',f:'ears'},
  chrome:{name:'Chrome Bot',price:450,c:'#c9d4e0',d:'#3a4656',f:'visor',vis:'#ff3355'},
  void:{name:'Void Walker',price:600,c:'#9b5cff',d:'#26104d',f:'halo',glow:true,trail:'#c59bff'},
  king:{name:'Golden King',price:1000,c:'#ffd34d',d:'#6b4a00',f:'crown',glow:true,trail:'#ffe58a'},
  holo:{name:'Hologram',price:1500,c:'#7ff',d:'#123',f:'visor',vis:'#fff',rainbow:true,glow:true},
};

/* ---------- save ---------- */
const KEY='feral-circuit-v1';
const DEF={coins:0,pts:0,unlocked:0,cleared:{},up:{hp:0,dmg:0,rate:0,spd:0,dash:0,regen:0,multi:0},skins:['cadet'],skin:'cadet',weapons:['blaster'],weapon:'blaster',buddy:0,potions:1,muted:false};
function load(){
  const d=JSON.parse(JSON.stringify(DEF));
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){Object.assign(d,s);d.up=Object.assign({},DEF.up,s.up||{});}}catch(e){}
  return d;
}
let save=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
function stats(){const u=save.up;return{maxHp:100+20*u.hp,dmg:1+.15*u.dmg,rate:Math.pow(.917,u.rate),spd:240*(1+.06*u.spd),dashCd:1.4*Math.pow(.88,u.dash),regen:.8*u.regen,multi:u.multi}}
const roman=n=>['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n]||String(n);
function stageInfo(i){const b=STAGES[i%6],loop=Math.floor(i/6);return{b,loop,name:b.name+(loop?' '+roman(loop+1):'')}}
const firstPts=i=>3+i, replayPts=i=>1+Math.floor(i/3);

/* ---------- audio ---------- */
let AC=null,lastShot=0;
function unlockAudio(){if(AC||save.muted)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(type,f1,f2,dur,vol){
  if(save.muted||!AC)return;
  try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}
}
const sfx={
  shoot(){const n=performance.now();if(n-lastShot<70)return;lastShot=n;tone('square',900,420,.05,.025)},
  hit(){tone('sawtooth',220,70,.16,.09)},kill(){tone('triangle',500,1100,.09,.06)},
  coin(){tone('sine',1300,1700,.05,.035)},dash(){tone('sine',300,900,.12,.05)},
  boom(){tone('sawtooth',140,40,.5,.12)},zap(){tone('square',1800,200,.18,.04)},
  up(){tone('triangle',600,1400,.18,.07)},
};

/* ---------- input ---------- */
const keys={};let touchMode=false;
const ptr={x:0,y:0,down:false};const joy={id:null,ox:0,oy:0,x:0,y:0};
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}
addEventListener('keydown',e=>{
  unlockAudio();keys[e.code]=true;
  if(state==='play'){
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
    if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight')tryDash();
    if(e.code==='KeyQ')usePotion();
    if(e.code==='KeyP'||e.code==='Escape')pause();
  }else if(state==='paused'&&(e.code==='KeyP'||e.code==='Escape'))resume();
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false;if(state==='play')pause()});
cv.addEventListener('pointerdown',e=>{
  unlockAudio();const w=toWorld(e);
  if(e.pointerType==='mouse'){ptr.down=true;ptr.x=w.x;ptr.y=w.y;if(touchMode){touchMode=false;syncTouch()}}
  else{if(!touchMode){touchMode=true;syncTouch()}if(joy.id===null){joy.id=e.pointerId;joy.ox=joy.x=w.x;joy.oy=joy.y=w.y}}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{const w=toWorld(e);if(e.pointerId===joy.id){joy.x=w.x;joy.y=w.y}else if(e.pointerType==='mouse'){ptr.x=w.x;ptr.y=w.y}});
const pUp=e=>{if(e.pointerId===joy.id)joy.id=null;if(e.pointerType==='mouse')ptr.down=false};
cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('tDash').addEventListener('pointerdown',e=>{e.preventDefault();tryDash()});
$('tHeal').addEventListener('pointerdown',e=>{e.preventDefault();usePotion()});
$('healBtn').onclick=()=>usePotion();
$('pauseBtn').onclick=()=>pause();
function syncTouch(){$('touch').hidden=!(touchMode&&state==='play')}

/* ---------- game state ---------- */
let state='hub', run=null;

function startStage(si){
  const {b,loop,name}=stageInfo(si);const st=stats();
  run={si,b,loop,name,ri:0,st,mul:1+.32*si,dmul:1+.1*si,t:0,shake:0,flash:0,ts:1,ending:0,fade:0,fadeDir:0,coinsGot:0,
    p:{x:W/2,y:A.b-60,r:15,hp:st.maxHp,maxHp:st.maxHp,aim:-Math.PI/2,fireT:0,dashT:0,dashCd:0,inv:0,slowT:0,dx:0,dy:-1,trail:[]},
    buddy:{x:W/2,y:A.b-90,t:0,a:0},

/* ---------- helpers ---------- */

function burst(x,y,n,col,spd,size,life){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rnd(.3,1)*spd;run.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life||rnd(.3,.7),max:life||.6,col,r:rnd(.5,1)*size})}}

function ring(x,y,n,spd,o){o=o||{};const off=o.off!=null?o.off:Math.random()*TAU;for(let i=0;i<n;i++)eShot(x,y,off+i*TAU/n,spd,o)}
function fan(x,y,a,n,spread,spd,o){for(let i=0;i<n;i++)eShot(x,y,a+(n>1?(i/(n-1)-.5)*spread:0),spd,o)}
function tele(o){run.tele.push(Object.assign({t:0,col:'#ff3355'},o))}
function minions(){return run.en.filter(e=>!e.boss).length}
function nearestEnemy(x,y,maxD){let best=null,bd=maxD||1e9;for(const e of run.en){if(e.spawn>0)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;best=e}}return best}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(x1+dx*t),py-(y1+dy*t))}

function hurt(d){
  const p=run.p;if(p.inv>0||p.dashT>0||run.ending)return;
  p.hp-=d;p.inv=.7;run.shake=Math.max(run.shake,8);run.flash=.25;sfx.hit();ftxt(p.x,p.y-24,'-'+Math.round(d),'#ff4d6d');

}
function tryDash(){const p=run&&run.p;if(!p||state!=='play'||p.dashCd>0)return;p.dashT=.18;p.dashCd=run.st.dashCd;sfx.dash();burst(p.x,p.y,10,'#bff',160,4)}

}

/* ---------- player ---------- */
function fire(){
  const r=run,p=r.p,w=WEAP[save.weapon]||WEAP.blaster,st=r.st;
  const extra=st.multi;let shots=[];
  if(w.n>1){const n=w.n+extra*2,sp=w.spread+extra*.12;for(let i=0;i<n;i++)shots.push(p.aim+(i/(n-1)-.5)*sp+rnd(-.04,.04))}
  else{const n=1+extra;for(let i=0;i<n;i++)shots.push(p.aim+(i-(n-1)/2)*.13)}
  for(const a of shots){const cx=Math.cos(a),cy=Math.sin(a);
    r.pb.push({x:p.x+cx*20,y:p.y+cy*20,vx:cx*w.spd,vy:cy*w.spd,spd:w.spd,r:w.r,dmg:w.dmg*st.dmg,life:w.life||1.4,pierce:w.pierce,hit:w.pierce?new Set():null,homing:w.homing,col:w.col,rail:w.pierce})}
  p.fireT=w.delay*st.rate;sfx.shoot();
}
function updatePlayer(dt){
  const r=run,p=r.p;let mx=0,my=0;
  if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;
  if(joy.id!==null){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/55);mx=dx/l*k;my=dy/l*k}}
  const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
  if(l>.1){p.dx=mx/(l>1?1:l);p.dy=my/(l>1?1:l)}
  let spd=r.st.spd*(p.slowT>0?.55:1);
  if(p.dashT>0){p.dashT-=dt;spd=r.st.spd*3.2;const dl=Math.hypot(p.dx,p.dy)||1;mx=p.dx/dl;my=p.dy/dl}
  p.x=clamp(p.x+mx*spd*dt,A.l+p.r,A.r-p.r);
  p.y=clamp(p.y+my*spd*dt,A.t+p.r,A.b-p.r);
  p.dashCd=Math.max(0,p.dashCd-dt);p.inv=Math.max(0,p.inv-dt);p.slowT=Math.max(0,p.slowT-dt);p.fireT-=dt;
  if(r.st.regen&&p.hp>0)p.hp=Math.min(p.maxHp,p.hp+r.st.regen*dt);
  const sk=SKINS[save.skin];if(sk&&sk.trail||p.dashT>0){p.trail.push({x:p.x,y:p.y,l:.35});}
  for(const t of p.trail)t.l-=dt;p.trail=p.trail.filter(t=>t.l>0);
  // aim + fire
  const tgt=nearestEnemy(p.x,p.y,touchMode?520:1e9);
  if(touchMode){if(tgt)p.aim=Math.atan2(tgt.y-p.y,tgt.x-p.x);else if(l>.1)p.aim=Math.atan2(my,mx)}
  else p.aim=Math.atan2(ptr.y-p.y,ptr.x-p.x);
  const wantFire=touchMode?!!tgt:ptr.down;
  if(wantFire&&p.fireT<=0&&!r.ending)fire();
  // buddy drone
  if(save.buddy>0){const b=r.buddy;b.a+=dt*2;const tx=p.x+Math.cos(b.a)*38,ty=p.y+Math.sin(b.a)*38-6;b.x+=(tx-b.x)*Math.min(1,dt*8);b.y+=(ty-b.y)*Math.min(1,dt*8);
    b.t-=dt;const bt=nearestEnemy(b.x,b.y,480);if(bt&&b.t<=0){const a=Math.atan2(bt.y-b.y,bt.x-b.x);r.pb.push({x:b.x,y:b.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,spd:620,r:4,dmg:(6+4*save.buddy)*r.st.dmg,life:1.2,col:'#ffe27a'});b.t=Math.max(.35,1.05-.13*save.buddy)}}
}

/* ---------- enemies ---------- */
function updateEnemy(e,dt){
  const r=run,p=r.p;
  if(e.spawn>0){e.spawn-=dt;return}
  e.t+=dt;e.flash=Math.max(0,e.flash-dt);
  if(e.boss){bossUpdate(e,dt);return}
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);
  let vx=0,vy=0;
  switch(e.kind){
    case 'wolf':case 'robodog':case 'spiderling':{
      e.stT-=dt;let s=e.spd;
      if(e.st===1){s*=2.5;if(e.stT<=0){e.st=0;e.stT=rnd(1.8,3)}}
      else if(e.kind!=='spiderling'&&e.stT<=0&&d<230){e.st=1;e.stT=.35}
      const wob=Math.sin(e.t*3+e.a)*.5;vx=Math.cos(ang+wob)*s;vy=Math.sin(ang+wob)*s;e.face=ang;break}
    case 'boar':{
      e.stT+=dt;
      if(e.st===0){vx=Math.cos(ang)*e.spd;vy=Math.sin(ang)*e.spd;e.face=ang;if(e.stT>2.2){e.st=1;e.stT=0;e.ca=ang}}
      else if(e.st===1){e.face=e.ca;if(e.stT>.55){e.st=2;e.stT=0}}
      else{vx=Math.cos(e.ca)*430;vy=Math.sin(e.ca)*430;if(e.stT>.75||e.x<=A.l+e.r+1||e.x>=A.r-e.r-1||e.y<=A.t+e.r+1||e.y>=A.b-e.r-1){e.st=0;e.stT=0;if(e.stT===0)burst(e.x,e.y,8,'#a98',120,4)}}
      break}
    case 'spider':{
      const want=d>260?1:d<180?-1:0;vx=Math.cos(ang)*e.spd*want+Math.cos(ang+Math.PI/2)*e.spd*.6*e.orb;vy=Math.sin(ang)*e.spd*want+Math.sin(ang+Math.PI/2)*e.spd*.6*e.orb;e.face=ang;
      e.stT+=dt;if(e.stT>2.3){e.stT=0;fan(e.x,e.y,ang,3,.4,190,{slow:true,col:'#e8f6ff',r:7,dmg:8})}
      break}
    case 'hawk':{
      e.stT+=dt;
      if(e.st===0){const oa=ang+Math.PI+e.orb*.9;const tx=p.x+Math.cos(oa)*190,ty=p.y+Math.sin(oa)*190;const tdx=tx-e.x,tdy=ty-e.y,tl=Math.hypot(tdx,tdy)||1;vx=tdx/tl*e.spd;vy=tdy/tl*e.spd;e.face=Math.atan2(vy,vx);if(e.stT>2.8){e.st=1;e.stT=0;e.ca=ang}}
      else{vx=Math.cos(e.ca)*440;vy=Math.sin(e.ca)*440;e.face=e.ca;if(e.stT>.55){e.st=0;e.stT=0}}
      break}
    case 'drone':{
      const want=d>250?1:d<200?-1:0;vx=Math.cos(ang)*e.spd*want+Math.cos(ang+Math.PI/2)*e.spd*e.orb;vy=Math.sin(ang)*e.spd*want+Math.sin(ang+Math.PI/2)*e.spd*e.orb;e.face=ang;
      e.stT+=dt;if(e.stT>1.9){e.stT=0;eShot(e.x,e.y,ang,250,{col:'#59e6ff',r:5,dmg:10})}
      if(Math.random()<dt*.3)e.orb*=-1;break}
    case 'turret':{
      e.face=ang;e.stT+=dt;
      if(e.stT>2.2){const k=Math.floor((e.stT-2.2)/.16);if(k>(e.shot==null?-1:e.shot)&&k<3){e.shot=k;fan(e.x,e.y,ang,3,.35,260,{col:'#ffb347',r:5,dmg:10})}if(e.stT>2.8){e.stT=0;e.shot=-1}}
      break}
  }
  e.x=clamp(e.x+vx*dt,A.l+e.r,A.r-e.r);e.y=clamp(e.y+vy*dt,A.t+e.r,A.b-e.r);
}

/* ---------- bosses ---------- */
const BIDLE={
  grizzlor(e,dt,ang){mv(e,Math.cos(ang)*75,Math.sin(ang)*75,dt)},
  venom(e,dt,ang,d){const k=d>160?60:-40;mv(e,Math.cos(ang)*k,Math.sin(ang)*k,dt)},
  sentinel(e,dt){seek(e,W/2+Math.sin(e.t*.5)*W*.25,A.t+(A.b-A.t)*.3+Math.sin(e.t)*60,85,dt)},
  hydra(e,dt){seek(e,W/2+Math.sin(e.t*.6)*W*.3,A.t+130,110,dt)},
  roc(e,dt){if(!e.wp||Math.hypot(e.wp.x-e.x,e.wp.y-e.y)<30)e.wp={x:rnd(A.l+80,A.r-80),y:rnd(A.t+80,A.t+(A.b-A.t)*.55)};seek(e,e.wp.x,e.wp.y,250,dt)},
  omega(e,dt){seek(e,W/2+Math.sin(e.t*.4)*140,A.t+(A.b-A.t)*.33+Math.cos(e.t*.7)*40,70,dt)},
};
const BATKS={
  grizzlor:e=>e.p2?['charge','slam','swipe','roar','charge']:['charge','slam','swipe'],
  sentinel:e=>e.p2?['spiral','beams','burst','drones']:['spiral','beams','burst'],
  venom:e=>['web','brood','leap','rain'].concat(e.p2?['leap','web']:[]),
  hydra:e=>['missiles','flame','sweep','ring'].concat(e.p2?['missiles']:[]),
  roc:e=>e.p2?['lightning','feathers','dive','ring','lightning']:['lightning','feathers','dive'],
  omega:e=>['spiral','beams','missiles','lightning','ring','drones'].concat(e.p2?['sweep','rain']:[]),
};
function mv(e,vx,vy,dt){e.x=clamp(e.x+vx*dt,A.l+e.r,A.r-e.r);e.y=clamp(e.y+vy*dt,A.t+e.r,A.b-e.r)}
function seek(e,tx,ty,s,dt){const dx=tx-e.x,dy=ty-e.y,l=Math.hypot(dx,dy);if(l<2)return;const k=Math.min(s,l*3);mv(e,dx/l*k,dy/l*k,dt)}
function endAtk(e){e.atk=null;e.cool=e.p2?.5:.9;if(e.kind==='omega')e.cool*=.8}
function bossUpdate(e,dt){
  const p=run.p,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,ang=Math.atan2(dy,dx);e.face=ang;
  if(!e.p2&&e.hp<e.maxHp*.5){e.p2=true;banner('ENRAGED','The boss is getting angry',1200,'#ff3355');run.shake=12;sfx.boom()}
  if(e.atk){e.atk.t+=dt;ATK[e.atk.n](e,dt,e.atk,ang,d);return}
  BIDLE[e.kind](e,dt,ang,d);
  e.cool-=dt;
  if(e.cool<=0){let list=BATKS[e.kind](e).filter(n=>n!==e.last);if(minions()>=6)list=list.filter(n=>!['roar','drones','brood'].includes(n));
    const n=list[Math.floor(Math.random()*list.length)]||'ring';e.last=n;e.atk={n,t:0,s:0,acc:0,k:0}}
}
const ATK={
  charge(e,dt,a,ang,d,spd){
    if(a.s===0){a.a=ang;a.s=1;tele({kind:'line',x:e.x,y:e.y,a:a.a,len:900,w:e.r*1.6,dur:.7,follow:e})}
    else if(a.s===1&&a.t>.7){a.s=2;a.t=0}
    else if(a.s===2){const v=spd||640;e.x+=Math.cos(a.a)*v*dt;e.y+=Math.sin(a.a)*v*dt;
      if(Math.random()<.6)run.parts.push({x:e.x,y:e.y,vx:0,vy:0,life:.3,max:.3,col:'#0006',r:e.r*.6});
      const hit=e.x<A.l+e.r||e.x>A.r-e.r||e.y<A.t+e.r||e.y>A.b-e.r;
      if(hit||a.t>.9){e.x=clamp(e.x,A.l+e.r,A.r-e.r);e.y=clamp(e.y,A.t+e.r,A.b-e.r);if(hit){ring(e.x,e.y,e.p2?14:10,200,{col:'#ffb347'});run.shake=10;sfx.boom();burst(e.x,e.y,20,'#cba',220,5)}endAtk(e)}}
  },
  dive(e,dt,a,ang,d){ATK.charge(e,dt,a,ang,d,760)},
  slam(e,dt,a){
    if(a.s===0){a.s=1;tele({kind:'circle',x:e.x,y:e.y,r:155,dur:.8})}
    else if(a.t>.8){ring(e.x,e.y,e.p2?24:18,220,{col:'#ffb347',r:7});if(Math.hypot(run.p.x-e.x,run.p.y-e.y)<155+run.p.r)hurt(22*run.dmul);run.shake=14;sfx.boom();burst(e.x,e.y,40,'#c9a27a',320,6);endAtk(e)}
  },
  swipe(e,dt,a,ang){const times=[0,.3,.6];while(a.k<3&&a.t>=times[a.k]){fan(e.x,e.y,ang,5,.6,280,{col:'#ff7a59',r:6,dmg:12});a.k++}if(a.t>.85)endAtk(e)},
  roar(e){banner('ROAR!','',700,'#ff8a3d');for(let i=0;i<2;i++)spawnEnemy(e.kind==='grizzlor'?'wolf':'drone',clamp(e.x+rnd(-90,90),A.l+30,A.r-30),clamp(e.y+rnd(40,90),A.t+30,A.b-30),.5);run.shake=8;endAtk(e)},
  drones(e){for(let i=0;i<2;i++)spawnEnemy('drone',clamp(e.x+rnd(-100,100),A.l+30,A.r-30),clamp(e.y+rnd(30,90),A.t+30,A.b-30),.6);endAtk(e)},
  brood(e){for(let i=0;i<3;i++)spawnEnemy('spiderling',clamp(e.x+rnd(-80,80),A.l+20,A.r-20),clamp(e.y+rnd(20,80),A.t+20,A.b-20),.4);endAtk(e)},
  spiral(e,dt,a){a.acc+=dt;const arms=e.p2?4:2,gap=e.kind==='omega'?.09:.075;a.rot=a.rot||0;
    while(a.acc>gap){a.acc-=gap;for(let i=0;i<arms;i++)eShot(e.x,e.y,a.rot+i*TAU/arms,190,{col:e.kind==='omega'?'#ff5af0':'#ff3355',r:6,dmg:11});a.rot+=.23}
    if(a.t>3)endAtk(e)},
  beams(e,dt,a,ang){if(a.s===0){a.s=1;const n=e.p2?4:2,dir=Math.random()<.5?1:-1;for(let i=0;i<n;i++)run.beams.push({o:e,a:ang+.5+i*TAU/n,rot:dir*(e.p2?.95:.75),len:1600,w:18,warn:.9,dur:2.6,t:0,col:'#ff2255'})}if(a.t>3.5)endAtk(e)},
  sweep(e,dt,a,ang){if(a.s===0){a.s=1;const dir=Math.random()<.5?1:-1;run.beams.push({o:e,a:ang-dir*1,rot:dir*1.35,len:1600,w:22,warn:.8,dur:1.5,t:0,col:'#ff7a2a'})}if(a.t>2.4)endAtk(e)},
  burst(e,dt,a,ang){const times=[0,.35,.7];while(a.k<3&&a.t>=times[a.k]){fan(e.x,e.y,ang,5,.4,310,{col:'#ff3355'});a.k++}if(a.t>1)endAtk(e)},
  web(e,dt,a,ang){const times=[0,.5];while(a.k<2&&a.t>=times[a.k]){fan(e.x,e.y,ang,7,1.1,200,{slow:true,col:'#e8f6ff',r:8,dmg:10});a.k++}if(a.t>.8)endAtk(e)},
  leap(e,dt,a){const p=run.p;
    if(a.s===0){a.s=1;a.sx=e.x;a.sy=e.y;a.tx=p.x;a.ty=p.y;tele({kind:'circle',x:p.x,y:p.y,r:115,dur:.9,col:'#c06bff'})}
    else{const k=Math.min(1,a.t/.9);e.x=a.sx+(a.tx-a.sx)*k;e.y=a.sy+(a.ty-a.sy)*k;e.air=Math.sin(k*Math.PI);
      if(k>=1){e.air=0;e.x=clamp(e.x,A.l+e.r,A.r-e.r);e.y=clamp(e.y,A.t+e.r,A.b-e.r);ring(e.x,e.y,14,210,{col:'#c06bff'});if(Math.hypot(p.x-e.x,p.y-e.y)<115+p.r)hurt(20*run.dmul);run.shake=12;sfx.boom();burst(e.x,e.y,30,'#7a3fa0',260,5);endAtk(e)}}},
  rain(e,dt,a){if(a.s===0){a.s=1;const p=run.p;for(let i=0;i<6;i++){const x=i?clamp(p.x+rnd(-260,260),A.l+40,A.r-40):p.x,y=i?clamp(p.y+rnd(-200,200),A.t+40,A.b-40):p.y;
      tele({kind:'circle',x,y,r:58,dur:.9+i*.08,col:'#8dff5a',done:t=>{if(Math.hypot(run.p.x-t.x,run.p.y-t.y)<t.r+run.p.r)hurt(16*run.dmul);burst(t.x,t.y,16,'#8dff5a',200,5)}})}}
    if(a.t>.5)endAtk(e)},
  missiles(e,dt,a,ang){if(a.s===0){a.s=1;const n=e.p2?5:3;for(let i=0;i<n;i++){const aa=ang+(i/(n-1)-.5)*2.2;eShot(e.x+Math.cos(aa)*e.r,e.y+Math.sin(aa)*e.r,aa,230,{homing:2.1,col:'#ff9a3c',r:8,dmg:16,life:4.5})}sfx.zap()}if(a.t>.7)endAtk(e)},
  flame(e,dt,a,ang){a.acc+=dt;while(a.acc>.045){a.acc-=.045;eShot(e.x+Math.cos(ang)*e.r,e.y+Math.sin(ang)*e.r,ang+rnd(-.2,.2),330,{col:'#ff8a2a',r:6,dmg:9,life:1.1})}if(a.t>1.6)endAtk(e)},
  ring(e,dt,a){const times=[0,.4];while(a.k<2&&a.t>=times[a.k]){ring(e.x,e.y,e.p2?26:20,200,{col:'#ffd166',off:a.k*.15});a.k++}if(a.t>.8)endAtk(e)},
  lightning(e,dt,a){if(a.s===0){a.s=1;const p=run.p,n=e.p2?8:5;for(let i=0;i<n;i++){const x=i?rnd(A.l+50,A.r-50):p.x,y=i?rnd(A.t+50,A.b-50):p.y;
      tele({kind:'circle',x,y,r:56,dur:.85+i*.06,col:'#ffe95a',done:t=>{if(Math.hypot(run.p.x-t.x,run.p.y-t.y)<t.r+run.p.r)hurt(18*run.dmul);run.bolts=(run.bolts||[]);run.bolts.push({x:t.x,y:t.y,life:.25});burst(t.x,t.y,14,'#fff6a0',220,4);sfx.zap()}})}}
    if(a.t>.5)endAtk(e)},

};

/* ---------- main update ---------- */
function update(dt){
  const r=run,p=r.p;r.t+=dt;
  updatePlayer(dt);
  for(const e of r.en)updateEnemy(e,dt);
  // separation
  for(let i=0;i<r.en.length;i++)for(let j=i+1;j<r.en.length;j++){const a=r.en[i],b=r.en[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d>0&&d<m){const push=(m-d)/2,nx=dx/d,ny=dy/d;if(!a.boss){a.x-=nx*push;a.y-=ny*push}if(!b.boss){b.x+=nx*push;b.y+=ny*push}}}
  // contact
  for(const e of r.en){if(e.spawn>0||e.air>.3)continue;if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r-3)hurt((e.boss?22:e.dmg)*r.dmul)}
  // player bullets
  for(const b of r.pb){
    if(b.homing){const t=nearestEnemy(b.x,b.y,380);if(t){const ca=Math.atan2(b.vy,b.vx),ta=Math.atan2(t.y-b.y,t.x-b.x);let df=((ta-ca+Math.PI*3)%TAU)-Math.PI;const na=ca+clamp(df,-5*dt,5*dt);b.vx=Math.cos(na)*b.spd;b.vy=Math.sin(na)*b.spd}}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<A.l-20||b.x>A.r+20||b.y<A.t-20||b.y>A.b+20){b.dead=true;continue}
    for(const e of r.en){if(e.spawn>0||e.hp<=0)continue;if(b.hit&&b.hit.has(e))continue;
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){e.hp-=b.dmg;e.flash=.08;if(Math.random()<.5||b.dmg>20)ftxt(e.x+rnd(-8,8),e.y-e.r-4,Math.round(b.dmg),'#fff');burst(b.x,b.y,3,b.col,90,3);
        if(e.hp<=0)kill(e);if(b.hit)b.hit.add(e);else{b.dead=true;break}}}
  }
  r.pb=r.pb.filter(b=>!b.dead);r.en=r.en.filter(e=>e.hp>0);
  // enemy bullets
  for(const b of r.eb){
    if(b.homing){const ca=Math.atan2(b.vy,b.vx),ta=Math.atan2(p.y-b.y,p.x-b.x);let df=((ta-ca+Math.PI*3)%TAU)-Math.PI;const na=ca+clamp(df,-b.homing*dt,b.homing*dt);b.vx=Math.cos(na)*b.spd;b.vy=Math.sin(na)*b.spd;
      if(Math.random()<.5)r.parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.3,max:.3,col:'#ffcf7a',r:3})}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<A.l-30||b.x>A.r+30||b.y<A.t-30||b.y>A.b+30){b.dead=true;continue}
    if(Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r-2){if(p.inv<=0&&p.dashT<=0){hurt(b.dmg);if(b.slow)p.slowT=1.6;b.dead=true}}
  }
  r.eb=r.eb.filter(b=>!b.dead);
  // telegraphs
  for(const t of r.tele){t.t+=dt;if(t.follow&&t.kind==='line'){t.x=t.follow.x;t.y=t.follow.y}if(t.t>=t.dur){t.dead=true;if(t.done)t.done(t)}}
  r.tele=r.tele.filter(t=>!t.dead);
  // beams
  for(const bm of r.beams){bm.t+=dt;if(bm.o.hp<=0){bm.dead=true;continue}
    if(bm.t>bm.warn)bm.a+=bm.rot*dt;if(bm.t>bm.warn+bm.dur){bm.dead=true;continue}
    if(bm.t>bm.warn){const x2=bm.o.x+Math.cos(bm.a)*bm.len,y2=bm.o.y+Math.sin(bm.a)*bm.len;if(segDist(p.x,p.y,bm.o.x,bm.o.y,x2,y2)<bm.w/2+p.r-2)hurt(14*r.dmul)}}
  r.beams=r.beams.filter(b=>!b.dead);
  // laser grids
  if(!r.cleared)for(const z of r.lz){const ph=(r.t+z.off)%4.4;z.state=ph<2.3?0:ph<3.1?1:2;
    if(z.state===2){const d=z.h?Math.abs(p.y-(A.t+(A.b-A.t)*z.pos)):Math.abs(p.x-(A.l+(A.r-A.l)*z.pos));if(d<p.r+5)hurt(12*r.dmul)}}
  // coins
  for(const c of r.coins){c.t+=dt;const dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy)||1;
    if(d<120||r.cleared||c.t>6){const s=Math.min(900,200+c.t*300);c.x+=dx/d*s*dt;c.y+=dy/d*s*dt}else{c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=.9;c.vy*=.9}
    if(d<p.r+8){c.dead=true;save.coins+=c.v;r.coinsGot+=c.v;sfx.coin()}}
  r.coins=r.coins.filter(c=>!c.dead);
  // fx
  for(const q of r.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.life-=dt}r.parts=r.parts.filter(q=>q.life>0);
  if(r.parts.length>700)r.parts.splice(0,r.parts.length-700);
  for(const t of r.texts){t.y-=40*dt;t.life-=dt}r.texts=r.texts.filter(t=>t.life>0);
  if(r.bolts){for(const b of r.bolts)b.life-=dt;r.bolts=r.bolts.filter(b=>b.life>0)}
  r.shake=Math.max(0,r.shake-dt*30);r.flash=Math.max(0,r.flash-dt);
  // clear check
  if(!r.cleared&&!r.boss&&r.en.length===0&&r.t>.8){r.cleared=true;r.eb=[];banner('ROOM CLEAR','Go through the door',1200,'#9be15d');sfx.up();p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.1);persist()}
  // door
  if(r.cleared&&!r.fadeDir&&Math.abs(p.x-W/2)<52&&p.y-p.r<A.t+16){r.fadeDir=1}
}
function kill(e){
  const r=run;sfx.kill();burst(e.x,e.y,e.boss?80:16,e.col,e.boss?420:200,e.boss?8:5);
  const total=Math.round((e.boss?50+30*r.si:e.coin)*(1+.15*r.si));const n=e.boss?24:Math.min(5,total);
  for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rnd(60,e.boss?380:160);r.coins.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,v:Math.max(1,Math.round(total/n)),t:0})}
  if(e.boss){r.ending=2;r.ts=.3;r.shake=20;r.eb=[];r.beams=[];r.tele=[];for(const m of r.en)if(m!==e){m.hp=0;burst(m.x,m.y,10,m.col,150,4)}sfx.boom();banner(BOSS[e.kind].name+' DOWN','',1600,'#ffc93c')}
}

/* ---------- flow ---------- */
function pause(){if(state!=='play')return;state='paused';syncTouch();showModal(`<h2>Paused</h2><p>${run.name} · Room ${run.ri+1}</p>
  <div class="row"><button class="btn" data-m="resume">Resume</button><button class="btn ghost" data-m="quit">Quit to base</button></div><p style="font-size:12px">Quitting keeps the coins you picked up.</p>`)}
function resume(){state='play';$('modal').hidden=true;syncTouch();last=performance.now()}
function gameOver(){
  state='over';persist();syncTouch();
  showModal(`<h2 style="color:var(--danger)">Knocked out</h2><p>${run.name} · Room ${run.ri+1} of ${run.b.rooms.length+1}</p>
  <div class="rewards"><div class="chip"><span class="coin"></span><b>+${run.coinsGot}</b><span class="lbl">coins kept</span></div></div>
  <p>Spend coins and upgrade points at base, then try again.</p>
  <div class="row"><button class="btn" data-m="retry">Try again</button><button class="btn ghost" data-m="base">Base</button></div>`);
}
function victory(){
  const r=run,first=!save.cleared[r.si];const pts=first?firstPts(r.si):replayPts(r.si);
  for(const c of r.coins){save.coins+=c.v;r.coinsGot+=c.v}r.coins=[];
  save.pts+=pts;save.cleared[r.si]=true;save.unlocked=Math.max(save.unlocked,r.si+1);persist();
  state='won';syncTouch();
  showModal(`<h2 style="color:var(--gold)">Boss defeated</h2><p>${BOSS[r.b.boss].name} has fallen. ${first?'First clear bonus!':''}</p>
  <div class="rewards"><div class="chip"><span class="gem"></span><b>+${pts}</b><span class="lbl">upgrade pts</span></div><div class="chip"><span class="coin"></span><b>+${r.coinsGot}</b><span class="lbl">coins</span></div></div>
  <div class="row"><button class="btn p" data-m="spend">Spend points</button><button class="btn" data-m="next">Next stage</button><button class="btn ghost" data-m="base">Base</button></div>`);
  sfx.up();
}
function showModal(h){$('mcard').innerHTML=h;$('modal').hidden=false}
$('modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;
  if(m==='resume')resume();
  else if(m==='retry')startStage(run.si);
  else if(m==='next')startStage(run.si+1);
  else{persist();toHub(m==='spend'?'upgrades':'missions')}});
function toHub(t){state='hub';run=null;tab=t||tab;$('modal').hidden=true;$('hud').hidden=true;$('bossbar').hidden=true;$('hub').hidden=false;syncTouch();renderHub()}

/* ---------- render ---------- */
const BG={forest:{floor:'#1d3a22',wall:'#0e1f12',edge:'#3f7a3a'},cave:{floor:'#1d1726',wall:'#0c0912',edge:'#5b3f78'},peak:{floor:'#2a3546',wall:'#121925',edge:'#9fb3cc'},lab:{floor:'#0b1322',wall:'#050912',edge:'#37e2ff'},vault:{floor:'#100b1e',wall:'#05030b',edge:'#ff5af0'}};
function drawFloor(g,t){
  const r=run,b=BG[r.b.biome];g.fillStyle=b.wall;g.fillRect(0,0,W,H);
  g.fillStyle=b.floor;g.fillRect(A.l,A.t,A.r-A.l,A.b-A.t);
  const aw=A.r-A.l,ah=A.b-A.t;
  if(r.b.theme==='tech'){
    g.strokeStyle=b.edge+'18';g.lineWidth=1;g.beginPath();
    for(let x=A.l;x<=A.r;x+=48){g.moveTo(x,A.t);g.lineTo(x,A.b)}for(let y=A.t;y<=A.b;y+=48){g.moveTo(A.l,y);g.lineTo(A.r,y)}g.stroke();
    for(const d of r.decor){const x=A.l+d.fx*aw,y=A.t+d.fy*ah;g.fillStyle=b.edge+(Math.sin(t*2+d.k*9)>.6?'30':'14');g.fillRect(x-20*d.s,y-12*d.s,40*d.s,24*d.s);g.strokeStyle=b.edge+'40';g.strokeRect(x-20*d.s,y-12*d.s,40*d.s,24*d.s)}
  }else{
    for(const d of r.decor){const x=A.l+d.fx*aw,y=A.t+d.fy*ah,s=d.s;
      if(r.b.biome==='forest'){if(d.k<.75){g.strokeStyle='#2f5a2e';g.lineWidth=2;g.beginPath();g.moveTo(x-4*s,y);g.lineTo(x-6*s,y-8*s);g.moveTo(x,y);g.lineTo(x,y-10*s);g.moveTo(x+4*s,y);g.lineTo(x+6*s,y-8*s);g.stroke()}
        else if(d.k<.88){g.fillStyle='#27502a';g.beginPath();g.arc(x,y,16*s,0,TAU);g.fill();g.fillStyle='#326634';g.beginPath();g.arc(x-4*s,y-4*s,10*s,0,TAU);g.fill()}
        else{g.fillStyle=d.k<.94?'#f4d35e':'#f28fb2';g.beginPath();g.arc(x,y,3*s,0,TAU);g.fill()}}
      else if(r.b.biome==='cave'){if(d.k<.6){g.fillStyle='#2a2236';g.beginPath();g.ellipse(x,y,14*s,9*s,d.rot,0,TAU);g.fill()}else if(d.k<.8){g.fillStyle='#8a5cd655';g.beginPath();g.moveTo(x,y-14*s);g.lineTo(x+6*s,y);g.lineTo(x-6*s,y);g.fill()}else{g.strokeStyle='#ffffff10';g.lineWidth=1.5;g.beginPath();g.arc(x,y,20*s,d.rot,d.rot+1.6);g.stroke()}}
      else{if(d.k<.5){g.fillStyle='#e8f0ff18';g.beginPath();g.ellipse(x,y,22*s,10*s,d.rot,0,TAU);g.fill()}else if(d.k<.75){g.fillStyle='#1c2533';g.beginPath();g.ellipse(x,y,12*s,8*s,d.rot,0,TAU);g.fill()}else{g.fillStyle='#ffffff30';g.fillRect(x,y,2,2)}}
    }
  }
  // walls
  g.strokeStyle=b.edge;g.lineWidth=4;g.globalAlpha=.7;g.strokeRect(A.l,A.t,aw,ah);g.globalAlpha=1;
  // door
  const open=r.cleared,dc=open?'#9be15d':'#ff4d6d';
  g.fillStyle=b.wall;g.fillRect(W/2-54,A.t-14,108,18);
  g.fillStyle=dc;g.globalAlpha=open?.6+.4*Math.sin(t*6):.8;g.fillRect(W/2-50,A.t-8,100,10);g.globalAlpha=1;
  if(open){const gr=g.createLinearGradient(0,A.t,0,A.t+70);gr.addColorStop(0,'#9be15d55');gr.addColorStop(1,'#9be15d00');g.fillStyle=gr;g.fillRect(W/2-50,A.t,100,70);
    g.fillStyle='#e8ffe0';g.font='14px Bungee, Impact, sans-serif';g.textAlign='center';g.fillText(r.ri>=r.b.rooms.length-1?'BOSS ▲':'EXIT ▲',W/2,A.t+30)}
}
function drawLasers(g,t){
  for(const z of run.lz){if(run.cleared)break;const st=z.state||0;
    const x1=z.h?A.l:A.l+(A.r-A.l)*z.pos,y1=z.h?A.t+(A.b-A.t)*z.pos:A.t,x2=z.h?A.r:x1,y2=z.h?y1:A.b;
    g.fillStyle='#37e2ff';g.fillRect(x1-6,y1-6,12,12);g.fillRect(x2-6,y2-6,12,12);
    if(st===0){g.strokeStyle='#ff335522';g.lineWidth=2;g.setLineDash([6,10])}
    else if(st===1){g.strokeStyle=Math.sin(t*30)>0?'#ff3355cc':'#ff335544';g.lineWidth=3;g.setLineDash([12,6])}
    else{g.strokeStyle='#ff3355';g.lineWidth=10;g.setLineDash([]);g.shadowColor='#ff3355';g.shadowBlur=16}
    g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
    if(st===2){g.strokeStyle='#fff';g.lineWidth=3;g.stroke()}
    g.setLineDash([]);g.shadowBlur=0}
}
function drawPlayer(g,x,y,r,skinId,aim,t,inv){

  // gun
  g.save();g.rotate(aim);g.fillStyle='#1a2233';g.fillRect(r*.3,-r*.24,r*1.1,r*.48);g.fillStyle=c;g.fillRect(r*1.2,-r*.17,r*.3,r*.34);g.restore();

  if(f==='horns'){g.strokeStyle='#ffe2b0';g.lineWidth=r*.22;g.lineCap='round';for(const s of[-1,1]){g.beginPath();g.moveTo(s*r*.45,-r*.7);g.quadraticCurveTo(s*r*1.05,-r*.95,s*r*.9,-r*1.45);g.stroke()}g.lineCap='butt'}
  if(sk.glow){g.shadowColor=c;g.shadowBlur=r*1.1}
  g.fillStyle=c;g.beginPath();g.arc(0,0,r,0,TAU);g.fill();g.shadowBlur=0;
  g.lineWidth=r*.14;g.strokeStyle=sk.d;g.stroke();
  g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.arc(-r*.35,-r*.38,r*.3,0,TAU);g.fill();
  const ex=Math.cos(aim)*r*.28,ey=Math.sin(aim)*r*.2;
  if(f==='visor'){g.fillStyle='#0b1020';g.beginPath();g.roundRect?g.roundRect(ex-r*.62,ey-r*.42,r*1.24,r*.46,r*.2):g.rect(ex-r*.62,ey-r*.42,r*1.24,r*.46);g.fill();

  if(r.fade>0){g.fillStyle=`rgba(0,0,0,${r.fade})`;g.fillRect(0,0,W,H)}
  // dash cooldown ring
  if(p.dashCd>0&&state==='play'){g.strokeStyle='#ffffff66';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,p.r+9,-Math.PI/2,-Math.PI/2+TAU*(1-p.dashCd/r.st.dashCd));g.stroke()}
}
const mb=[];for(let i=0;i<60;i++)mb.push({x:Math.random(),y:Math.random(),s:rnd(.5,2),v:rnd(.01,.04),c:Math.random()<.5?'#37e2ff':'#9be15d'});
function drawMenuBg(g,t){g.fillStyle='#070b14';g.fillRect(0,0,W,H);g.strokeStyle='#37e2ff12';g.lineWidth=1;g.beginPath();const off=(t*20)%48;for(let x=-48+off;x<W;x+=48){g.moveTo(x,0);g.lineTo(x,H)}for(let y=-48+off;y<H;y+=48){g.moveTo(0,y);g.lineTo(W,y)}g.stroke();
  for(const m of mb){m.y-=m.v*.016;if(m.y<0)m.y=1;g.fillStyle=m.c+'66';g.beginPath();g.arc(m.x*W,m.y*H,m.s,0,TAU);g.fill()}}

/* ---------- HUD ---------- */
const hc={};
function setT(id,v){if(hc[id]!==v){hc[id]=v;$(id).textContent=v}}
function hud(){
  const r=run,p=r.p;$('hpFill').style.width=(100*p.hp/p.maxHp)+'%';setT('hpTxt',Math.ceil(p.hp)+'/'+p.maxHp);
  setT('stTxt',(r.si+1)+'-'+(r.ri>=r.b.rooms.length?'BOSS':r.ri+1));setT('coinTxt',String(save.coins));setT('potTxt',String(save.potions));
  if(r.boss)$('bossFill').style.width=Math.max(0,100*r.boss.hp/r.boss.maxHp)+'%';
  $('tHeal').textContent='HEAL '+save.potions;
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  let rdt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'&&run){
    if(run.fadeDir){run.fade+=run.fadeDir*rdt*3.5;if(run.fadeDir>0&&run.fade>=1){run.fade=1;run.fadeDir=-1;enterRoom(run.ri+1)}else if(run.fadeDir<0&&run.fade<=0){run.fade=0;run.fadeDir=0}}
    update(rdt*run.ts);
    if(run.ending){run.ending-=rdt;if(run.ending<=1.2)run.ts=Math.min(1,run.ts+rdt);if(run.ending<=0){run.ending=0;victory()}}
    if(run)hud();
  }
  render(now/1000);requestAnimationFrame(frame);
}

/* ---------- base / hub ---------- */
let tab='missions';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderHub()});
$('muteBtn').onclick=()=>{save.muted=!save.muted;persist();renderHub();if(!save.muted)unlockAudio()};
function price(n){return `<span class="price"><span class="coin"></span>${n}</span>`}
function renderHub(){
  $('wCoins').textContent=save.coins;$('wPts').textContent=save.pts;$('muteBtn').textContent='Sound: '+(save.muted?'off':'on');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  let h='';
  if(tab==='missions'){
    const count=save.unlocked>=6?save.unlocked+1:6;
    h+=`<div class="grid">`;
    for(let i=0;i<count;i++){const {b,loop,name}=stageInfo(i),bd=BOSS[b.boss],locked=i>save.unlocked,done=save.cleared[i];
      h+=`<div class="card ${b.theme} ${locked?'locked':''}"><div class="kicker"><span>Stage ${i+1}</span><span class="t-${b.theme}">${loop?'Endless · ':''}${b.theme==='wild'?'Wild beasts':'High-tech lab'}</span></div>
      <h4>${name}</h4><div class="boss">Boss: <b>${bd.name}</b> <span style="color:var(--muted)">· ${bd.title}</span></div>
      <p>${b.rooms.length} rooms, then the boss. Reward: <span style="color:var(--pts)">+${done?replayPts(i):firstPts(i)} pts</span>${done?'':' (first clear)'}</p>
      <div class="row">${locked?'<span class="lbl">Beat stage '+i+' to unlock</span>':`<button class="btn ${b.theme==='wild'?'g':''}" data-act="play" data-i="${i}">${done?'Replay':'Fight'}</button>`}${done?'<span class="done">✓ Cleared</span>':''}</div></div>`}
    h+=`</div><div class="help"><div><b>Move</b> WASD or arrows · touch: drag the left side</div><div><b>Shoot</b> hold mouse · touch: auto-aims for you</div><div><b>Dash</b> Space (you can't be hit mid-dash)</div><div><b>Heal</b> Q · uses a Repair Kit</div></div>`;
  }else if(tab==='upgrades'){
    h+=`<p style="margin:0;color:var(--muted)">Beat bosses to earn upgrade points. Upgrades are permanent.</p><div class="grid">`;
    for(const u of UPG){const l=save.up[u.id],max=l>=u.max,c=upCost(u.id,l);
      h+=`<div class="card"><div class="kicker"><span>${u.name}</span><span>Lv ${l}/${u.max}</span></div><p>${u.desc}</p><div class="pips">${Array.from({length:u.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div>
      <div class="row">${max?'<span class="done">MAXED</span>':`<button class="btn p" data-act="up" data-id="${u.id}" ${save.pts<c?'disabled':''}>Upgrade · ${c} pt${c>1?'s':''}</button>`}</div></div>`}
    const st=stats();h+=`</div><div class="help"><div><b>Max HP</b> ${st.maxHp}</div><div><b>Damage</b> ×${st.dmg.toFixed(2)}</div><div><b>Fire rate</b> ×${(1/st.rate).toFixed(2)}</div><div><b>Speed</b> ${Math.round(st.spd)}</div><div><b>Dash cooldown</b> ${st.dashCd.toFixed(2)}s</div><div><b>Regen</b> ${st.regen.toFixed(1)} HP/s</div></div>`;
  }else{
    h+=`<h3>Skins</h3><div class="grid">`;
    for(const id in SKINS){const s=SKINS[id],own=save.skins.includes(id),on=save.skin===id;
      h+=`<div class="card ${on?'sel':''}"><canvas class="prev" data-skin="${id}" width="144" height="144"></canvas><h4 style="text-align:center">${s.name}</h4><div class="row" style="justify-content:center">${on?'<span class="done">EQUIPPED</span>':own?`<button class="btn ghost" data-act="skin" data-id="${id}">Equip</button>`:`<button class="btn g" data-act="buyskin" data-id="${id}" ${save.coins<s.price?'disabled':''}>Buy</button>${price(s.price)}`}</div></div>`}
    h+=`</div><h3>Weapons</h3><div class="grid">`;
    for(const id in WEAP){const w=WEAP[id],own=save.weapons.includes(id),on=save.weapon===id;
      h+=`<div class="card ${on?'sel':''}"><div class="kicker"><span>Weapon</span><span style="color:${w.col}">${Math.round(w.dmg*w.n)} dmg · ${(1/w.delay).toFixed(1)}/s</span></div><h4>${w.name}</h4><p>${w.desc}</p><div class="row">${on?'<span class="done">EQUIPPED</span>':own?`<button class="btn ghost" data-act="weap" data-id="${id}">Equip</button>`:`<button class="btn g" data-act="buyweap" data-id="${id}" ${save.coins<w.price?'disabled':''}>Buy</button>${price(w.price)}`}</div></div>`}
    const bc=300+300*save.buddy;
    h+=`</div><h3>Gear</h3><div class="grid">
      <div class="card"><div class="kicker"><span>Companion</span><span>Lv ${save.buddy}/5</span></div><h4>Buddy Drone</h4><p>A little drone that orbits you and shoots the nearest enemy. Each level shoots faster and harder.</p>
      <div class="row">${save.buddy>=5?'<span class="done">MAXED</span>':`<button class="btn g" data-act="buddy" ${save.coins<bc?'disabled':''}>${save.buddy?'Upgrade':'Buy'}</button>${price(bc)}`}</div></div>
      <div class="card"><div class="kicker"><span>Consumable</span><span>Carrying ${save.potions}/5</span></div><h4>Repair Kit</h4><p>Press Q (or HEAL) mid-fight to restore half your HP.</p>
      <div class="row">${save.potions>=5?'<span class="done">FULL</span>':`<button class="btn g" data-act="potion" ${save.coins<60?'disabled':''}>Buy</button>${price(60)}`}</div></div></div>`;
  }
  $('hubBody').innerHTML=h;
  document.querySelectorAll('canvas.prev').forEach(c=>{const g=c.getContext('2d');g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,72,72);drawPlayer(g,36,40,20,c.dataset.skin,.6,1.5,0)});
}
$('hubBody').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;unlockAudio();const a=b.dataset.act,id=b.dataset.id;
  if(a==='play'){startStage(+b.dataset.i);return}
  if(a==='up'){const c=upCost(id,save.up[id]);if(save.pts>=c){save.pts-=c;save.up[id]++;sfx.up()}}
  if(a==='skin')save.skin=id;
  if(a==='buyskin'){const p=SKINS[id].price;if(save.coins>=p){save.coins-=p;save.skins.push(id);save.skin=id;sfx.up();toast(SKINS[id].name+' unlocked')}}
  if(a==='weap')save.weapon=id;
  if(a==='buyweap'){const p=WEAP[id].price;if(save.coins>=p){save.coins-=p;save.weapons.push(id);save.weapon=id;sfx.up();toast(WEAP[id].name+' unlocked')}}
  if(a==='buddy'){const p=300+300*save.buddy;if(save.coins>=p&&save.buddy<5){save.coins-=p;save.buddy++;sfx.up()}}
  if(a==='potion'){if(save.coins>=60&&save.potions<5){save.coins-=60;save.potions++;sfx.coin()}}
  persist();renderHub();
});

renderHub();requestAnimationFrame(frame);
</script>
