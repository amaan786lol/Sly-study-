<meta charset="utf-8">
<title>Face Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a blue game tray of 24 flip cards beside a control panel; panel stacks above the tray on phones. */
:root{
  --bg:#e7ecf3; --ink:#1d2a3a; --muted:#5b6b80; --panel:#ffffff; --line:#cfd8e4;
  --tray:#2f5a8f; --tray-edge:#23466f; --card:#fbfcfe; --card-ink:#1d2a3a; --card-back:#d9493a; --card-back-2:#c13d30;
  --accent:#f2b134; --accent-ink:#2a1e00; --yes:#2f8a57; --no:#c2412f;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a25; --ink:#e6edf6; --muted:#93a3b8; --panel:#1a2433; --line:#2c3a4e;
  --tray:#1f3d63; --tray-edge:#152b47; --card:#e9eef5; --card-back:#b83c30; --card-back-2:#a23428;
  --yes:#4fbf80; --no:#ef6a55; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121a25; --ink:#e6edf6; --muted:#93a3b8; --panel:#1a2433; --line:#2c3a4e;
  --tray:#1f3d63; --tray-edge:#152b47; --card:#e9eef5; --card-back:#b83c30; --card-back-2:#a23428;
  --yes:#4fbf80; --no:#ef6a55; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:18px 28px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:2rem;margin:0;letter-spacing:.01em}
h1 span{color:var(--tray)}
:root[data-theme="dark"] h1 span{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1 span{color:var(--accent)}}
.status{font-family:var(--display);font-weight:600;font-size:1.05rem;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.status.you{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.tray{background:var(--tray);border-radius:18px;padding:14px;box-shadow:inset 0 -6px 0 var(--tray-edge)}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.card{all:unset;cursor:pointer;perspective:700px;display:block;border-radius:12px}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.inner{position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);aspect-ratio:100/130}
.card.down .inner{transform:rotateX(180deg)}
.face,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px}
.face{background:var(--card);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.face svg{width:100%;flex:1;min-height:0;display:block}
.face .nm{font-family:var(--display);font-weight:600;color:var(--card-ink);text-align:center;font-size:.92rem;padding:2px 0 6px}
.back{transform:rotateX(180deg);background:repeating-linear-gradient(45deg,var(--card-back) 0 10px,var(--card-back-2) 10px 20px);
  display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:2rem;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.guessing .card:not(.down) .face{outline:3px dashed var(--accent);outline-offset:-3px}
.card.pending .face{outline:4px solid var(--accent)!important;outline-offset:-4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.mine{display:flex;gap:12px;align-items:center}
.mine .mini{width:78px;flex:none;background:var(--card);border-radius:10px;overflow:hidden}
.mine .mini svg{display:block;width:100%}
.mine b{font-family:var(--display);font-size:1.3rem;font-weight:600}
.mine small{display:block;color:var(--muted)}
select,button.btn{font:inherit}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--no);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grow{flex:1}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.count{border:1px solid var(--line);border-radius:12px;padding:10px}
.count .n{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:6px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--tray)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;font-size:.9rem}
.log li{padding:7px 10px;border-radius:10px;background:var(--bg)}
.log .who{font-weight:800}
.yes{color:var(--yes);font-weight:800}.no{color:var(--no);font-weight:800}
.opts{display:flex;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);align-items:center}
.opts label{display:flex;gap:6px;align-items:center}
.opts select{width:auto;padding:5px 8px}
.confirm{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.modal{position:fixed;inset:0;background:rgba(10,16,26,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);border-radius:18px;padding:22px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px}
.modal h2{font-family:var(--display);font-size:2rem;margin:0}
.reveal{display:flex;gap:16px;justify-content:center}
.reveal div{width:110px}
.reveal .mini{background:var(--card);border-radius:10px;overflow:hidden}
.reveal svg{display:block;width:100%}
.reveal p{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
@media (max-width:860px){
  .game{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .tray{padding:10px}
}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Face <span>Hunt</span></h1>
    <div class="status" id="status">Your turn</div>
  </header>
  <div class="game">
    <div class="tray"><div class="board" id="board"></div></div>
    <aside class="panel">
      <div>
        <div class="label">Your secret person</div>
        <div class="mine" id="mine"></div>
      </div>
      <div class="counts">
        <div class="count"><div class="label">You have left</div><div class="n" id="myN">24</div><div class="dots" id="myDots"></div></div>
        <div class="count"><div class="label">CPU has left</div><div class="n" id="cpuN">24</div><div class="dots" id="cpuDots"></div></div>
      </div>
      <div id="askBox" style="display:flex;flex-direction:column;gap:8px">
        <div class="label">Ask a yes / no question</div>
        <select id="q" aria-label="Question"></select>
        <div class="row">
          <button class="btn primary grow" id="askBtn">Ask</button>
          <button class="btn" id="guessBtn">Make a guess</button>
        </div>
      </div>
      <div class="confirm" id="confirm" hidden>
        <div id="confirmText">Tap a face on the board to guess it.</div>
        <div class="row">
          <button class="btn danger grow" id="confirmBtn" disabled>Guess</button>
          <button class="btn" id="cancelBtn">Cancel</button>
        </div>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="auto" checked> Auto-flip</label>
        <label>CPU <select id="diff"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label>
        <button class="btn" id="newBtn">New game</button>
      </div>
      <div>
        <div class="label">Questions so far</div>
        <ul class="log" id="log"></ul>
      </div>
    </aside>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="box">
    <h2 id="mTitle">You win!</h2>
    <div id="mText"></div>
    <div class="reveal" id="mReveal"></div>
    <button class="btn primary" id="againBtn">Play again</button>
  </div>
</div>

<script>
const NAMES=["Ada","Bruno","Cleo","Dev","Esme","Felix","Gus","Hana","Ivo","Juno","Kofi","Lena","Milo","Nia","Otto","Priya","Quinn","Rosa","Sami","Tess","Umar","Vera","Wren","Yuki"];
const SKIN=["#f6d3b3","#e8b58f","#c98e62","#9a6340","#6b4228"];
const HAIR={black:"#211c1b",brown:"#6b3f22",blonde:"#e6c25c",red:"#c4532a",gray:"#b9b6b0"};
const EYE={brown:"#6a3d1e",blue:"#3d86d6",green:"#3f9c5a"};
const SHIRT={red:"#d9483b",blue:"#3a6fd8",green:"#3c9a5f",yellow:"#e8b931",purple:"#8152c4"};
const HATS=["#2d3a4a","#b83a3a","#2f7a6b","#d98b2b"];
const rnd=Math.random, pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function makeCast(){
  const names=shuffle(NAMES), seen=new Set(), cast=[];
  while(cast.length<24){
    const style=rnd()<.12?"bald":pick(["short","short","long","long","curly","bun","spiky"]);
    const c={id:cast.length,name:names[cast.length],skin:pick(SKIN),style,
      hair:style==="bald"?null:pick(Object.keys(HAIR)),eyes:pick(Object.keys(EYE)),
      glasses:rnd()<.3,hat:(style==="short"||style==="long")&&rnd()<.3,hatColor:pick(HATS),
      beard:rnd()<.2,mustache:rnd()<.22,earrings:rnd()<.3,freckles:rnd()<.25,smile:rnd()<.6,shirt:pick(Object.keys(SHIRT))};
    const sig=[c.style,c.hair,c.eyes,c.glasses,c.hat,c.beard,c.mustache,c.earrings,c.freckles,c.smile,c.shirt].join();
    if(seen.has(sig))continue; seen.add(sig); cast.push(c);
  }
  return cast;
}

const Q=[
  ...Object.keys(HAIR).map(h=>({g:"Hair",t:`Do they have ${h} hair?`,f:c=>c.hair===h})),
  {g:"Hair",t:"Are they bald?",f:c=>c.style==="bald"},
  {g:"Hair",t:"Do they have long hair?",f:c=>c.style==="long"},
  {g:"Hair",t:"Do they have curly hair?",f:c=>c.style==="curly"},
  {g:"Hair",t:"Is their hair in a bun?",f:c=>c.style==="bun"},
  {g:"Hair",t:"Is their hair spiky?",f:c=>c.style==="spiky"},
  ...Object.keys(EYE).map(e=>({g:"Face",t:`Do they have ${e} eyes?`,f:c=>c.eyes===e})),
  {g:"Face",t:"Are they wearing glasses?",f:c=>c.glasses},
  {g:"Face",t:"Do they have a beard?",f:c=>c.beard},
  {g:"Face",t:"Do they have a mustache?",f:c=>c.mustache},
  {g:"Face",t:"Do they have freckles?",f:c=>c.freckles},
  {g:"Face",t:"Are they smiling?",f:c=>c.smile},
  {g:"Clothes",t:"Are they wearing a hat?",f:c=>c.hat},
  {g:"Clothes",t:"Are they wearing earrings?",f:c=>c.earrings},
  ...Object.keys(SHIRT).map(s=>({g:"Clothes",t:`Is their shirt ${s}?`,f:c=>c.shirt===s})),
];

function faceSVG(c){
  const H=c.hair?HAIR[c.hair]:"#5a4636", S=c.skin, p=[];
  p.push(`<rect width="100" height="110" fill="#dfe8f3"/>`);
  if(c.style==="long") p.push(`<path d="M24 48 Q22 18 50 17 Q78 18 76 48 L80 96 Q50 102 20 96Z" fill="${H}"/>`);
  if(c.style==="curly") for(let a=0;a<14;a++){const t=Math.PI*(0.9+a*1.2/13); p.push(`<circle cx="${50+29*Math.cos(t)}" cy="${50+31*Math.sin(t)}" r="8" fill="${H}"/>`)}
  p.push(`<path d="M15 110 Q19 84 50 82 Q81 84 85 110Z" fill="${SHIRT[c.shirt]}"/>`);
  p.push(`<rect x="43" y="68" width="14" height="17" fill="${S}"/>`);
  p.push(`<circle cx="26" cy="52" r="5" fill="${S}"/><circle cx="74" cy="52" r="5" fill="${S}"/>`);
  if(c.earrings) p.push(`<circle cx="26" cy="60" r="2.8" fill="#f2c230" stroke="#9a7a10" stroke-width=".8"/><circle cx="74" cy="60" r="2.8" fill="#f2c230" stroke="#9a7a10" stroke-width=".8"/>`);
  p.push(`<ellipse cx="50" cy="50" rx="24" ry="28" fill="${S}"/>`);
  if(c.beard) p.push(`<path d="M26 52 Q27 84 50 84 Q73 84 74 52 Q71 70 50 72 Q29 70 26 52Z" fill="${H}"/>`);
  if(c.hat){
    p.push(`<rect x="24" y="38" width="6" height="14" rx="3" fill="${H}"/><rect x="70" y="38" width="6" height="14" rx="3" fill="${H}"/>`);
    p.push(`<path d="M25 39 Q26 12 50 12 Q74 12 75 39Z" fill="${c.hatColor}"/><rect x="22" y="35" width="56" height="9" rx="4.5" fill="${c.hatColor}" stroke="rgba(0,0,0,.18)" stroke-width="1.5"/><circle cx="50" cy="12" r="4.5" fill="${c.hatColor}"/>`);
  } else if(c.style==="short"||c.style==="long") p.push(`<path d="M26 47 Q23 19 50 19 Q77 19 74 47 Q71 31 50 30 Q31 31 26 47Z" fill="${H}"/>`);
  else if(c.style==="curly") for(let a=0;a<9;a++){const t=Math.PI*(1.05+a*0.9/8); p.push(`<circle cx="${50+22*Math.cos(t)}" cy="${44+20*Math.sin(t)}" r="7.5" fill="${H}"/>`)}
  else if(c.style==="bun") p.push(`<circle cx="50" cy="15" r="9" fill="${H}"/><path d="M26 46 Q24 21 50 21 Q76 21 74 46 Q70 30 50 29 Q31 30 26 46Z" fill="${H}"/>`);
  else if(c.style==="spiky") p.push(`<path d="M26 46 L24 26 L33 31 L35 14 L43 26 L50 10 L57 26 L65 14 L67 31 L76 26 L74 46 Q70 31 50 30 Q31 31 26 46Z" fill="${H}"/>`);
  const brow=c.hair?H:"#5a4636";
  p.push(`<path d="M35 42 Q40 39 45 42" stroke="${brow}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M55 42 Q60 39 65 42" stroke="${brow}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`);
  for(const x of [40,60]) p.push(`<ellipse cx="${x}" cy="50" rx="5" ry="4" fill="#fff"/><circle cx="${x}" cy="50" r="2.7" fill="${EYE[c.eyes]}"/><circle cx="${x}" cy="50" r="1.2" fill="#111"/>`);
  if(c.glasses) p.push(`<g stroke="#26303c" stroke-width="2" fill="rgba(255,255,255,.12)"><circle cx="40" cy="50" r="7.5"/><circle cx="60" cy="50" r="7.5"/></g><path d="M47.5 50 L52.5 50 M32.5 49 L26 47 M67.5 49 L74 47" stroke="#26303c" stroke-width="2"/>`);
  if(c.freckles) for(const [x,y] of [[33,58],[36,61],[30,61],[67,58],[64,61],[70,61]]) p.push(`<circle cx="${x}" cy="${y}" r="1" fill="#a0522d" opacity=".8"/>`);
  p.push(`<path d="M50 52 Q47 59 50 60 Q52 60 53 59" stroke="rgba(0,0,0,.3)" stroke-width="1.6" fill="none" stroke-linecap="round"/>`);
  if(c.mustache) p.push(`<path d="M40 65 Q45 61 50 63.5 Q55 61 60 65 Q55 66.5 50 65.5 Q45 66.5 40 65Z" fill="${H}"/>`);
  p.push(c.smile?`<path d="M42 67 Q50 74 58 67" stroke="#7a2e2e" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
               :`<path d="M44 69 L56 69" stroke="#7a2e2e" stroke-width="2.2" stroke-linecap="round"/>`);
  return `<svg viewBox="0 0 100 110" aria-hidden="true">${p.join("")}</svg>`;
}

let S={};
const $=id=>document.getElementById(id);

function newGame(){
  const cast=makeCast(); const ids=shuffle(cast.map(c=>c.id));
  S={cast,me:ids[0],cpu:ids[1],down:new Set(),cpuC:cast.map(c=>c.id),asked:new Map(),cpuAsked:new Set(),turn:"player",guess:false,pending:null};
  $("log").innerHTML=""; $("modal").hidden=true;
  buildBoard(); buildSelect();
  const m=cast[S.me];
  $("mine").innerHTML=`<div class="mini">${faceSVG(m)}</div><div><b>${m.name}</b><small>The CPU is trying to find this person. Keep it secret.</small></div>`;
  render();
}

function buildBoard(){
  const b=$("board"); b.innerHTML="";
  S.cast.forEach(c=>{
    const el=document.createElement("button"); el.className="card"; el.id="card-"+c.id;
    el.setAttribute("aria-label",c.name);
    el.innerHTML=`<div class="inner"><div class="face">${faceSVG(c)}<div class="nm">${c.name}</div></div><div class="back">?</div></div>`;
    el.onclick=()=>cardClick(c.id); b.appendChild(el);
  });
}
function buildSelect(){
  const s=$("q"); s.innerHTML=""; const groups={};
  Q.forEach((q,i)=>{ if(!groups[q.g]){groups[q.g]=document.createElement("optgroup");groups[q.g].label=q.g;s.appendChild(groups[q.g])}
    const o=document.createElement("option"); o.value=i; o.textContent=q.t; groups[q.g].appendChild(o); });
}

function cardClick(id){
  if(S.turn==="over")return;
  if(S.guess){ if(S.turn!=="player")return; S.pending=id; render(); return; }
  S.down.has(id)?S.down.delete(id):S.down.add(id); render();
}

function logLine(who,text,ans,extra){
  const li=document.createElement("li");
  li.innerHTML=`<span class="who">${who}:</span> ${text} <span class="${ans?"yes":"no"}">${ans?"Yes":"No"}</span>${extra?` <span style="color:var(--muted)">${extra}</span>`:""}`;
  $("log").prepend(li);
}

function ask(){
  if(S.turn!=="player")return;
  const i=+$("q").value; if(S.asked.has(i))return;
  const q=Q[i], ans=q.f(S.cast[S.cpu]); S.asked.set(i,ans);
  let flipped=0;
  if($("auto").checked) S.cast.forEach(c=>{ if(!S.down.has(c.id)&&q.f(c)!==ans){S.down.add(c.id);flipped++} });
  logLine("You",q.t,ans,$("auto").checked?`(${flipped} flipped)`:"");
  const next=[...$("q").options].find(o=>!S.asked.has(+o.value)); if(next)$("q").value=next.value;
  S.turn="cpu"; render(); setTimeout(cpuTurn,1100);
}

function cpuTurn(){
  if(S.turn!=="cpu")return;
  if(S.cpuC.length===1){ const g=S.cast[S.cpuC[0]]; logLine("CPU",`Is it ${g.name}?`,true); return end(false,`The CPU guessed <b>${g.name}</b>.`); }
  const useful=Q.map((q,i)=>({i,y:S.cpuC.filter(id=>q.f(S.cast[id])).length}))
    .filter(o=>!S.cpuAsked.has(o.i)&&o.y>0&&o.y<S.cpuC.length);
  const best=useful.slice().sort((a,b)=>Math.abs(a.y*2-S.cpuC.length)-Math.abs(b.y*2-S.cpuC.length)||rnd()-.5)[0];
  const d=$("diff").value, smart=d==="hard"?1:d==="normal"?.55:0;
  const choice=rnd()<smart?best:pick(useful);
  const q=Q[choice.i], ans=q.f(S.cast[S.me]); S.cpuAsked.add(choice.i);
  const before=S.cpuC.length; S.cpuC=S.cpuC.filter(id=>q.f(S.cast[id])===ans);
  logLine("CPU",q.t,ans,`(${before-S.cpuC.length} flipped)`);
  S.turn="player"; render();
}

function end(win,msg){
  S.turn="over"; S.guess=false; render();
  $("mTitle").textContent=win?"You win!":"You lose";
  $("mText").innerHTML=msg;
  const cpu=S.cast[S.cpu], me=S.cast[S.me];
  $("mReveal").innerHTML=`<div><div class="mini">${faceSVG(cpu)}</div><p>CPU had <b>${cpu.name}</b></p></div><div><div class="mini">${faceSVG(me)}</div><p>You had <b>${me.name}</b></p></div>`;
  setTimeout(()=>{$("modal").hidden=false;$("againBtn").focus()},500);
}

function render(){
  S.cast.forEach(c=>{const el=$("card-"+c.id); el.classList.toggle("down",S.down.has(c.id)); el.classList.toggle("pending",S.pending===c.id);});
  $("board").classList.toggle("guessing",S.guess);
  const myLeft=24-S.down.size;
  $("myN").textContent=myLeft; $("cpuN").textContent=S.cpuC.length;
  $("myDots").innerHTML=Array.from({length:24},(_,i)=>`<i class="${i<myLeft?"on":""}"></i>`).join("");
  $("cpuDots").innerHTML=Array.from({length:24},(_,i)=>`<i class="${i<S.cpuC.length?"on":""}"></i>`).join("");
  [...$("q").options].forEach(o=>{const i=+o.value; if(S.asked.has(i)){o.disabled=true;o.textContent=`${Q[i].t} (${S.asked.get(i)?"Yes":"No"})`} });
  const mine=S.turn==="player";
  $("askBtn").disabled=!mine||S.guess||S.asked.has(+$("q").value); $("guessBtn").disabled=!mine; $("q").disabled=!mine||S.guess;
  $("askBox").hidden=false; $("confirm").hidden=!S.guess;
  $("guessBtn").textContent=S.guess?"Guessing…":"Make a guess";
  const p=S.pending!=null?S.cast[S.pending]:null;
  $("confirmText").innerHTML=p?`Guess <b>${p.name}</b>? A wrong guess loses the game.`:"Tap a face on the board to guess it.";
  $("confirmBtn").disabled=!p;
  const st=$("status");
  st.classList.toggle("you",mine);
  st.textContent=S.turn==="over"?"Game over":S.turn==="cpu"?"CPU is thinking…":S.guess?"Pick your guess":myLeft===1?"One left. Make your guess!":"Your turn";
}

$("askBtn").onclick=ask;
$("q").onchange=render;
$("guessBtn").onclick=()=>{S.guess=true;S.pending=null;render()};
$("cancelBtn").onclick=()=>{S.guess=false;S.pending=null;render()};
$("confirmBtn").onclick=()=>{
  const g=S.cast[S.pending]; S.pending=null;
  if(g.id===S.cpu){logLine("You",`Is it ${g.name}?`,true); end(true,`You found <b>${g.name}</b>.`)}
  else{logLine("You",`Is it ${g.name}?`,false); end(false,`It wasn't ${g.name}. A wrong guess ends the game.`)}
};
$("newBtn").onclick=newGame; $("againBtn").onclick=newGame;
newGame();
</script>
